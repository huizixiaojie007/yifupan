<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连板复盘</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入 html2canvas 库（用于将 HTML 转为图片） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入ECharts核心库 + K线模块 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/extension/dataTool.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            /* background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); */
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* padding: 20px; */
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.8;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        th {
            background-color: #f8f9fa;
            padding: 16px 15px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 1px solid #e1e5eb;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eef1f5;
            transition: all 0.2s ease;
            vertical-align: top;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .board-cell {
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            width: 80px;
        }

        .stock-cell {
            padding: 10px;
            border-left: 1px solid #eef1f5;
        }

        .time-sector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .time-info {
            color: #7f8c8d;
        }

        .sector-info {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 500;
        }

        .sector-tech {
            background-color: #e1f0ff;
            color: #0066cc;
        }

        .sector-energy {
            background-color: #e6f7ee;
            color: #00a854;
        }

        .sector-material {
            background-color: #fff7e6;
            color: #ff9900;
        }

        .sector-consumer {
            background-color: #fdeeee;
            color: #ff4d4f;
        }

        .sector-finance {
            background-color: #f0e6ff;
            color: #722ed1;
        }

        .stock-name {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .reason {
            font-size: 11px;
            color: #7f8c8d;
            line-height: 1.4;
            word-wrap: break-word;
            max-width: 200px;
        }

        .footer {
            padding: 15px 30px;
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            background-color: #f8f9fa;
            border-top: 1px solid #eef1f5;
        }

        @media (max-width: 768px) {
            .container {
                border-radius: 8px;
            }

            th, td {
                padding: 12px 10px;
            }

            .board-cell {
                width: 60px;
            }

            .reason {
                max-width: 150px;
            }
            .stock-name { font-size: 14px !important; }
            .reason { font-size: 10px !important; }
            .time-info, .sector-info, .longhu-info { font-size: 9px !important; }
            .stock-cell { min-height: 120px !important; padding: 6px !important; }
            #dual-container { gap: 10px !important; }
        }
    </style>
</head>

<body>

    <!-- 外层父容器：保持居中，不限制最大宽度（让容器随屏幕自适应） -->
    <div style="width: 100%; margin: 20px auto; box-sizing: border-box;">
      <!-- 时间导航栏：添加日期选择器 -->
      <div style="align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 15px;">
        <!-- 中间：日期显示和导航按钮（居中对齐） -->
        <div style="display: flex; align-items: center; gap: 15px; justify-content: center; flex-grow: 1;">
          <button id="prev-date" style="padding: 8px 16px; background: #409eff; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
            ← 前一天
          </button>
          <div style="font-size: 16px; font-weight: 600;">
<!--            <span id="left-date-text">&#45;&#45;.&#45;&#45;</span> | <span id="right-date-text">&#45;&#45;.&#45;&#45;</span>-->
              <select id="date-select" style="padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
            <!-- 日期选项将通过JavaScript动态添加 -->
          </select>
          </div>
          <button id="next-date" style="padding: 8px 16px; background: #409eff; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
            后一天 →
          </button>
        </div>
        
        <!-- 右侧：预留空间，保持布局平衡 -->
        <div style="width: 180px;"></div>
      </div>
        <!-- 新增K线切换按钮 -->
    <button id="kline-toggle-btn" style="padding: 8px 16px; background: #409eff; color: #fff; border: none; border-radius: 4px; cursor: pointer; position: fixed; top: 20px; right: 180px; padding: 10px 20px;
">
      显示K线
    </button>

      <!-- 左右双容器布局：核心放宽约束 -->
      <div id="dual-container" style="display: flex; justify-content: center; gap: 20px; width: 100%; overflow-x: auto;">
        <!-- 左侧容器：移除max-width限制，让容器随父容器自适应 -->
        <div id="left-container" style="flex: 1; min-width: 320px; /* 最小宽度，避免过小挤塌 */ border: 1px solid #eee; border-radius: 8px; padding: 15px; background: #fff; box-sizing: border-box;">
          <div class="header">
            <h3 style="text-align: center; margin-top: 0; color: white; padding: 8px; border-radius: 4px;" id="left-title">--.--日连板天梯</h3>
          </div>
          <!-- 内部滚动容器：保留，内容过宽时滚动 -->
          <div style="overflow-x: auto;">
            <!-- 表格：移除min-width固定值，改为100%自适应 -->
            <table id="left-table-body" style="width: 100%; border-collapse: collapse;">
              <!-- 左侧数据将动态渲染 -->
            </table>
          </div>
        </div>

        <!-- 右侧容器：与左侧完全一致 -->
        <div id="right-container" style="flex: 1; min-width: 320px; border: 1px solid #eee; border-radius: 8px; padding: 15px; background: #fff; box-sizing: border-box;">
          <div class="header">
            <h3 style="text-align: center; margin-top: 0; color: white; padding: 8px; border-radius: 4px;" id="right-title">--.--日连板天梯</h3>
          </div>
          <div style="overflow-x: auto;">
            <table id="right-table-body" style="width: 100%; border-collapse: collapse;">
              <!-- 右侧数据将动态渲染 -->
            </table>
          </div>
        </div>
      </div>
    </div>
    <!-- 引入你的表格生成逻辑 -->
<!--    <script type="module" src="js/tableData.js" defer></script>-->
    <!-- 常量→工具→状态→API→组件→渲染→导航→入口 -->
    <script type="module" src="js/constants/styleConstants.js"></script>
    <script type="module" src="js/constants/configConstants.js"></script>
    <script type="module" src="js/utils/dateUtils.js"></script>
    <script type="module" src="js/utils/colorUtils.js"></script>
    <script type="module" src="js/utils/stringUtils.js"></script>
    <script type="module" src="js/state/appState.js"></script>
    <script type="module" src="js/api/stockApi.js"></script>
    <script type="module" src="js/components/SectorTooltip.js"></script>
    <script type="module" src="js/components/StockDetailPopup.js"></script>
    <script type="module" src="js/components/DownloadButton.js"></script>
    <script type="module" src="js/components/ShowKlineButton.js"></script>
    <script type="module" src="js/renderer/dataProcessor.js"></script>
    <script type="module" src="js/renderer/tableRenderer.js"></script>
    <script type="module" src="js/navigation/dateNavigation.js"></script>
    <script type="module" src="js/main.js"></script>
    
    <!-- 监听导航栏状态变化，调整容器显示方式 -->
    <script>
        // 检查导航栏状态并调整容器显示
        function checkSidebarState() {
            try {
                // 通过 parent 访问父窗口的导航栏
                const sidebar = window.parent.document.getElementById('sidebar');
                const leftContainer = document.getElementById('left-container');
                const rightContainer = document.getElementById('right-container');
                
                console.log('检查导航栏状态:', sidebar ? '找到导航栏' : '未找到导航栏');
                if (sidebar) {
                    console.log('导航栏状态:', sidebar.classList.contains('sidebar-collapsed') ? '收起' : '展开');
                }
                
                if (sidebar && sidebar.classList.contains('sidebar-collapsed')) {
                    // 导航栏收起，显示左右两个容器
                    if (leftContainer) leftContainer.style.display = 'block';
                    if (rightContainer) {
                        rightContainer.style.display = 'block';
                        rightContainer.style.maxWidth = 'none';
                    }
                    console.log('显示左右两个容器');
                } else {
                    // 导航栏展开，只显示右侧容器
                    if (leftContainer) leftContainer.style.display = 'none';
                    if (rightContainer) {
                        rightContainer.style.display = 'block';
                        rightContainer.style.maxWidth = '750px';
                    }
                    console.log('只显示右侧容器');
                }
            } catch (e) {
                console.log('无法访问父窗口，可能是跨域限制:', e);
                // 如果无法访问父窗口，默认显示左右两个容器
                const leftContainer = document.getElementById('left-container');
                const rightContainer = document.getElementById('right-container');
                if (leftContainer) leftContainer.style.display = 'block';
                if (rightContainer) {
                    rightContainer.style.display = 'block';
                    rightContainer.style.maxWidth = 'none';
                }
            }
        }
        
        // 初始检查
        window.addEventListener('load', checkSidebarState);
        
        // 监听窗口大小变化（如果在主窗口中打开）
        window.addEventListener('resize', checkSidebarState);
        
        // 监听来自主窗口的消息（如果在新窗口中打开）
        window.addEventListener('message', function(event) {
            if (event.data === 'sidebarStateChanged') {
                checkSidebarState();
            }
        });
    </script>
</body>

</html>
