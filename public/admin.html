<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            /* max-width: 900px; */
            /* margin: 50px auto; */
            padding: 30px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 24px;
        }
        
        .header-btn {
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .header-btn:hover {
            background-color: #2980b9;
        }
        
        .header-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            flex: 1;
        }
        
        .form-group.full-width {
            flex: 100%;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper input[type="file"],
        .input-wrapper textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: #f9f9f9;
        }
        
        .input-wrapper textarea {
            min-height: 150px;
            max-height: 400px;
            resize: vertical;
            font-family: monospace;
            background-color: white;
            overflow-y: auto;
        }
        
        .clear-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #95a5a6;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        
        .clear-icon:hover {
            opacity: 1;
            background: #7f8c8d;
        }
        
        .clear-icon::before,
        .clear-icon::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 1px;
            background: white;
        }
        
        .clear-icon::before {
            transform: rotate(45deg);
        }
        
        .clear-icon::after {
            transform: rotate(-45deg);
        }
        
        .line-counter {
            position: absolute;
            right: 10px;
            bottom: 10px;
            font-size: 12px;
            color: #95a5a6;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 4px;
            display: none;
        }
        
        .status-message.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status-message.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 5px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>管理页面</h1>
            <button class="header-btn" id="submitBtn">提交</button>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
        
        <form id="adminForm" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label for="zhangtingFile">涨停</label>
                    <div class="input-wrapper">
                        <input type="file" id="zhangtingFile" name="zhangting_file">
                        <span class="clear-icon" onclick="clearFile('zhangtingFile')"></span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="huanshouFile">换手</label>
                    <div class="input-wrapper">
                        <input type="file" id="huanshouFile" name="huanshou_file">
                        <span class="clear-icon" onclick="clearFile('huanshouFile')"></span>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>龙虎榜</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="updateLonghu" name="update_longhu">
                        <span>更新龙虎榜</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>更新得分</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="updateScore" name="update_score">
                        <span>更新得分</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>更新换手率</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="updateTurnover" name="update_turnover">
                        <span>更新换手率</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>更新股票列表</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="updateStockList" name="update_stock_list">
                        <span>更新股票列表</span>
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group full-width">
                    <label for="bankuaiJson">板块json</label>
                    <div class="input-wrapper">
                        <textarea id="bankuaiJson" name="bankuai_json" placeholder="请输入板块json" rows="8"></textarea>
                        <span class="clear-icon" onclick="clearTextarea('bankuaiJson')"></span>
                        <span class="line-counter" id="bankuaiLineCounter">0 行</span>
                    </div>
                </div>
            </div>
        </form>
    </div>
    
    <script>
        function checkLogin() {
            const accessToken = localStorage.getItem('access_token');
            const userInfo = localStorage.getItem('user_info');
            if (!accessToken || !userInfo) {
                window.location.href = '/public/login.html';
                return false;
            }
            return true;
        }

        if (!checkLogin()) {
            document.write('<div style="text-align:center;padding-top:100px;">正在跳转到登录页面...</div>');
        }

        function clearFile(id) {
            document.getElementById(id).value = '';
        }
        
        function clearTextarea(id) {
            const textarea = document.getElementById(id);
            textarea.value = '';
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }
        
        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.min(textarea.scrollHeight, 800);
            textarea.style.height = newHeight + 'px';
            updateLineCounter(textarea);
        }
        
        function updateLineCounter(textarea) {
            const counter = document.getElementById('bankuaiLineCounter');
            if (counter) {
                const lines = textarea.value.split('\n').length;
                counter.textContent = lines + ' 行';
            }
        }
        
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const btn = this;
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="loading"></span>提交中...';
            btn.disabled = true;
            
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = 'status-message';
            
            const formData = new FormData();
            
            const zhangtingFile = document.getElementById('zhangtingFile').files[0];
            if (zhangtingFile) {
                formData.append('zhangting_file', zhangtingFile);
            }
            
            const huanshouFile = document.getElementById('huanshouFile').files[0];
            if (huanshouFile) {
                formData.append('huanshou_file', huanshouFile);
            }
            
            const updateLonghuChecked = document.getElementById('updateLonghu').checked;
            formData.append('update_longhu_flag', updateLonghuChecked ? 'yes' : 'no');
            
            const bankuaiJson = document.getElementById('bankuaiJson').value.trim();
            if (bankuaiJson) {
                formData.append('bankuai_json', bankuaiJson);
            }
            
            const updateScoreChecked = document.getElementById('updateScore').checked;
            formData.append('update_score_flag', updateScoreChecked ? 'yes' : 'no');
            
            const updateTurnoverChecked = document.getElementById('updateTurnover').checked;
            formData.append('update_turnover_flag', updateTurnoverChecked ? 'yes' : 'no');
            
            const updateStockListChecked = document.getElementById('updateStockList').checked;
            
            try {
                if (updateStockListChecked) {
                    statusMessage.textContent = '正在更新股票列表...';
                    statusMessage.className = 'status-message info';
                    
                    const stockListResponse = await fetch(window.location.origin + '/api/stock_list/sync', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const stockListResult = await stockListResponse.json();
                    
                    if (stockListResponse.ok) {
                        statusMessage.textContent = `股票列表更新成功！共处理 ${stockListResult.total_processed} 条，成功 ${stockListResult.success} 条，失败 ${stockListResult.fail} 条`;
                        statusMessage.className = 'status-message success';
                    } else {
                        statusMessage.textContent = `股票列表更新失败: ${stockListResult.detail || '未知错误'}`;
                        statusMessage.className = 'status-message error';
                        return;
                    }
                }
                
                const response = await fetch(window.location.origin + '/api/zhangting/stock/admin', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    statusMessage.textContent = result.message || '提交成功';
                    statusMessage.className = 'status-message success';
                } else {
                    statusMessage.textContent = result.detail || '提交失败';
                    statusMessage.className = 'status-message error';
                }
            } catch (error) {
                statusMessage.textContent = '网络错误，请稍后重试';
                statusMessage.className = 'status-message error';
                console.error('提交失败:', error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
        
        document.getElementById('zhangtingFile').addEventListener('change', function(e) {
            console.log('涨停文件选择:', e.target.files[0]);
        });
        
        document.getElementById('huanshouFile').addEventListener('change', function(e) {
            console.log('换手文件选择:', e.target.files[0]);
        });
        
        document.getElementById('bankuaiJson').addEventListener('input', function(e) {
            autoResizeTextarea(e.target);
        });
        
        // 初始化时设置高度
        document.addEventListener('DOMContentLoaded', function() {
            const textarea = document.getElementById('bankuaiJson');
            autoResizeTextarea(textarea);
        });
    </script>
</body>
</html>
