<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录/注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .form-container {
            padding: 40px;
            transition: all 0.3s ease;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: #2ed573;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .user-info {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .user-info.show {
            display: block;
        }

        .user-info h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .user-info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #ff3838;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 30px 20px;
            }

            .form-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- 用户信息显示区域 -->
            <div class="user-info" id="userInfo">
                <h3>登录成功！</h3>
                <p><strong>用户名：</strong><span id="userName"></span></p>
                <p><strong>邮箱：</strong><span id="userEmail"></span></p>
                <button class="logout-btn" onclick="logout()">退出登录</button>
                <button class="submit-btn" onclick="goToMain()" style="margin-top: 10px;">进入主页面</button>
            </div>

            <!-- 登录注册表单区域 -->
            <div id="authForms">
                <div class="form-header">
                    <h1>欢迎使用</h1>
                    <p>请登录或注册新账户</p>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">登录</div>
                    <div class="tab" onclick="switchTab('register')">注册</div>
                </div>

                <!-- 成功消息 -->
                <div class="success-message" id="successMessage"></div>

                <!-- 登录表单 -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" required placeholder="请输入用户名">
                        <div class="error-message" id="loginUsernameError"></div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" required placeholder="请输入密码">
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>
                    <button type="submit" class="submit-btn" id="loginBtn">
                        <span id="loginBtnText">登录</span>
                    </button>
                </form>

                <!-- 注册表单 -->
                <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="registerUsername" required placeholder="3-50个字符" minlength="3" maxlength="50">
                        <div class="error-message" id="registerUsernameError"></div>
                    </div>
                    <div class="form-group">
                        <label>邮箱（可选）</label>
                        <input type="email" id="registerEmail" placeholder="example@email.com">
                        <div class="error-message" id="registerEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="registerPassword" required placeholder="至少6个字符" minlength="6" maxlength="50">
                        <div class="error-message" id="registerPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="registerPasswordConfirm" required placeholder="请再次输入密码" minlength="6" maxlength="50">
                        <div class="error-message" id="registerPasswordConfirmError"></div>
                    </div>
                    <button type="submit" class="submit-btn" id="registerBtn">
                        <span id="registerBtnText">注册</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/auth';

        // 页面加载时检查是否已登录
        window.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
        });

        // 检查登录状态
        function checkLoginStatus() {
            const token = localStorage.getItem('access_token');
            const userInfo = localStorage.getItem('user_info');
            
            if (token && userInfo) {
                try {
                    // 直接跳转到index页面，不显示用户信息弹窗
                    window.location.href = '/public/index.html';
                } catch (e) {
                    console.error('解析用户信息失败:', e);
                    logout();
                }
            }
        }

        // 显示用户信息
        function showUserInfo(user) {
            document.getElementById('authForms').style.display = 'none';
            document.getElementById('userInfo').classList.add('show');
            document.getElementById('userName').textContent = user.username;
            document.getElementById('userEmail').textContent = user.email || '未设置';
        }

        // 切换标签页
        function switchTab(tab) {
            const loginTab = document.querySelector('.tab:first-child');
            const registerTab = document.querySelector('.tab:last-child');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
            
            // 清除错误消息
            clearErrors();
            hideSuccessMessage();
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            clearErrors();
            hideSuccessMessage();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('loginUsernameError', '请输入用户名和密码');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="loading"></span>登录中...';

            try {
                // 使用 FormData 格式发送（OAuth2 密码流要求）
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });

                // 检查响应状态
                if (response.status === 404) {
                    showError('loginPasswordError', 'API接口未找到，请检查服务器是否正常运行');
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    // 如果不是JSON响应，读取文本
                    const text = await response.text();
                    console.error('响应不是JSON格式:', text);
                    showError('loginPasswordError', `服务器错误: ${response.status} ${response.statusText}`);
                    return;
                }

                if (response.ok) {
                    // 保存 token 和用户信息
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_info', JSON.stringify(data.user));
                    localStorage.setItem('loginUser', data.user.username);
                    aa = localStorage.getItem('loginUser')
                        console.log('localStorage.getItem loginUser:::', aa);

                    // 直接跳转到index页面，不弹窗
                    window.location.href = '/public/index.html';
                } else {
                    showError('loginPasswordError', data.detail || data.message || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('loginPasswordError', `网络错误: ${error.message}，请检查服务器是否正常运行`);
            } finally {
                loginBtn.disabled = false;
                loginBtnText.textContent = '登录';
            }
        }

        // 处理注册
        async function handleRegister(event) {
            event.preventDefault();
            clearErrors();
            hideSuccessMessage();

            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            // 验证
            if (username.length < 3 || username.length > 50) {
                showError('registerUsernameError', '用户名长度必须在3-50个字符之间');
                return;
            }

            if (password.length < 6) {
                showError('registerPasswordError', '密码长度至少6个字符');
                return;
            }

            if (password !== passwordConfirm) {
                showError('registerPasswordConfirmError', '两次输入的密码不一致');
                return;
            }

            const registerBtn = document.getElementById('registerBtn');
            const registerBtnText = document.getElementById('registerBtnText');
            registerBtn.disabled = true;
            registerBtnText.innerHTML = '<span class="loading"></span>注册中...';

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email || null,
                        password: password
                    })
                });

                // 检查响应状态
                if (response.status === 404) {
                    showError('registerUsernameError', 'API接口未找到，请检查服务器是否正常运行');
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    // 如果不是JSON响应，读取文本
                    const text = await response.text();
                    console.error('响应不是JSON格式:', text);
                    showError('registerUsernameError', `服务器错误: ${response.status} ${response.statusText}`);
                    return;
                }

                if (response.ok) {
                    showSuccessMessage('注册成功！正在跳转到登录...');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                } else {
                    const errorMsg = data.detail || data.message || '注册失败';
                    if (errorMsg.includes('用户名')) {
                        showError('registerUsernameError', errorMsg);
                    } else if (errorMsg.includes('邮箱')) {
                        showError('registerEmailError', errorMsg);
                    } else {
                        showError('registerUsernameError', errorMsg);
                    }
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('registerUsernameError', `网络错误: ${error.message}，请检查服务器是否正常运行`);
            } finally {
                registerBtn.disabled = false;
                registerBtnText.textContent = '注册';
            }
        }

        // 显示错误消息
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
                const input = errorElement.previousElementSibling;
                if (input) {
                    input.classList.add('error');
                }
            }
        }

        // 清除所有错误
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            document.querySelectorAll('input.error').forEach(el => {
                el.classList.remove('error');
            });
        }

        // 显示成功消息
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = message;
            successMsg.classList.add('show');
        }

        // 隐藏成功消息
        function hideSuccessMessage() {
            document.getElementById('successMessage').classList.remove('show');
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            localStorage.removeItem('loginUser');
            document.getElementById('userInfo').classList.remove('show');
            document.getElementById('authForms').style.display = 'block';
            clearErrors();
            hideSuccessMessage();
        }

        // 跳转到主页面
        function goToMain() {
            window.location.href = '/public/index.html';
        }
    </script>
</body>
</html>
