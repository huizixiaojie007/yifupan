<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录/注册</title>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .form-container {
            padding: 40px;
            transition: all 0.3s ease;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input.error {
            border-color: #ff4757;
        }

        .error-message {
            color: #ff4757;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            background: #2ed573;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .user-info {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .user-info.show {
            display: block;
        }

        .user-info h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .user-info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #ff3838;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 30px 20px;
            }

            .form-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- 用户信息显示区域 -->
            <div class="user-info" id="userInfo">
                <h3>登录成功！</h3>
                <p><strong>用户名：</strong><span id="userName"></span></p>
                <p><strong>邮箱：</strong><span id="userEmail"></span></p>
                <button class="logout-btn" onclick="logout()">退出登录</button>
                <button class="submit-btn" onclick="goToMain()" style="margin-top: 10px;">进入主页面</button>
            </div>

            <!-- 登录注册表单区域 -->
            <div id="authForms">
                <div class="form-header">
                    <h1>欢迎使用</h1>
                    <p>请登录或注册新账户</p>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">登录</div>
                    <div class="tab" onclick="switchTab('register')">注册</div>
                </div>

                <!-- 成功消息 -->
                <div class="success-message" id="successMessage"></div>

                <!-- 登录表单 -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" required placeholder="请输入用户名" autocomplete="off">
                        <div class="error-message" id="loginUsernameError"></div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <div style="position: relative;">
                            <input type="password" id="loginPassword" required placeholder="请输入密码" style="width: 100%; padding-right: 40px;" autocomplete="off">
                            <button type="button" onclick="togglePassword('loginPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666;">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>
                    <div style="text-align: right; margin-bottom: 20px;">
                        <a href="#" onclick="switchToForgotPassword()" style="font-size: 14px; color: #667eea; text-decoration: none; hover: underline;">忘记密码</a>
                    </div>
                    <button type="submit" class="submit-btn" id="loginBtn">
                        <span id="loginBtnText">登录</span>
                    </button>
                </form>
                
                <!-- 忘记密码表单 -->
                <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)" style="display: none;">
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="forgotEmail" required placeholder="请输入注册邮箱">
                        <div class="error-message" id="forgotEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label>验证码</label>
                        <div style="position: relative;">
                            <input type="text" id="verificationCode" required placeholder="请输入验证码" style="width: 100%; padding-right: 100px;">
                            <button type="button" onclick="sendVerificationCode()" id="sendCodeBtn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #667eea; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;">
                                发送验证码
                            </button>
                        </div>
                        <div class="error-message" id="verificationCodeError"></div>
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <div style="position: relative;">
                            <input type="password" id="newPassword" required placeholder="请输入新密码" style="width: 100%; padding-right: 40px;">
                            <button type="button" onclick="togglePassword('newPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666;">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                        <div class="error-message" id="newPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <div style="position: relative;">
                            <input type="password" id="confirmNewPassword" required placeholder="请再次输入新密码" style="width: 100%; padding-right: 40px;">
                            <button type="button" onclick="togglePassword('confirmNewPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666;">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                        <div class="error-message" id="confirmNewPasswordError"></div>
                    </div>
                    <div style="text-align: right; margin-bottom: 20px;">
                        <a href="#" onclick="switchToLogin()" style="font-size: 14px; color: #667eea; text-decoration: none; hover: underline;">返回登录</a>
                    </div>
                    <button type="submit" class="submit-btn" id="forgotPasswordBtn">
                        <span id="forgotPasswordBtnText">确认重置</span>
                    </button>
                </form>

                <!-- 注册表单 -->
                <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="registerUsername" required placeholder="3-50个字符" minlength="3" maxlength="50">
                        <div class="error-message" id="registerUsernameError"></div>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="registerEmail" required placeholder="example@email.com">
                        <div class="error-message" id="registerEmailError"></div>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <div style="position: relative;">
                            <input type="password" id="registerPassword" required placeholder="至少6个字符" minlength="6" maxlength="50" style="width: 100%; padding-right: 40px;">
                            <button type="button" onclick="togglePassword('registerPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666;">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                        <div class="error-message" id="registerPasswordError"></div>
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <div style="position: relative;">
                            <input type="password" id="registerPasswordConfirm" required placeholder="请再次输入密码" minlength="6" maxlength="50" style="width: 100%; padding-right: 40px;">
                            <button type="button" onclick="togglePassword('registerPasswordConfirm', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #666;">
                                <i class="fa fa-eye-slash"></i>
                            </button>
                        </div>
                        <div class="error-message" id="registerPasswordConfirmError"></div>
                    </div>
                    <button type="submit" class="submit-btn" id="registerBtn">
                        <span id="registerBtnText">注册</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    


    <script>
        const API_BASE_URL = '/api/auth';

        // 页面加载时检查是否已登录
        window.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
        });

        // 检查登录状态
        function checkLoginStatus() {
            const token = localStorage.getItem('access_token');
            const userInfo = localStorage.getItem('user_info');
            
            if (token && userInfo) {
                try {
                    // 直接跳转到index页面，不显示用户信息弹窗
                    window.location.href = '/public/index.html';
                } catch (e) {
                    console.error('解析用户信息失败:', e);
                    logout();
                }
            }
        }

        // 显示用户信息
        function showUserInfo(user) {
            document.getElementById('authForms').style.display = 'none';
            document.getElementById('userInfo').classList.add('show');
            document.getElementById('userName').textContent = user.username;
            document.getElementById('userEmail').textContent = user.email || '未设置';
        }

        // 切换标签页
        function switchTab(tab) {
            const loginTab = document.querySelector('.tab:first-child');
            const registerTab = document.querySelector('.tab:last-child');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const tabs = document.querySelector('.tabs');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                forgotPasswordForm.style.display = 'none';
                tabs.style.display = 'flex';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
                forgotPasswordForm.style.display = 'none';
                tabs.style.display = 'flex';
                
                // 清空注册表单输入框
                document.getElementById('registerUsername').value = '';
                document.getElementById('registerEmail').value = '';
                document.getElementById('registerPassword').value = '';
                document.getElementById('registerPasswordConfirm').value = '';
            }
            
            // 清除错误消息
            clearErrors();
            hideSuccessMessage();
        }
        
        // 切换到忘记密码表单
        function switchToForgotPassword() {
            const loginForm = document.getElementById('loginForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const tabs = document.querySelector('.tabs');
            
            loginForm.style.display = 'none';
            forgotPasswordForm.style.display = 'block';
            tabs.style.display = 'none';
            
            // 清空输入框
            document.getElementById('forgotEmail').value = '';
            document.getElementById('verificationCode').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmNewPassword').value = '';
            
            // 清除错误消息
            clearErrors();
            hideSuccessMessage();
        }
        
        // 切换到登录表单
        function switchToLogin() {
            const loginForm = document.getElementById('loginForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const tabs = document.querySelector('.tabs');
            
            forgotPasswordForm.style.display = 'none';
            loginForm.style.display = 'block';
            tabs.style.display = 'flex';
            
            // 清除错误消息
            clearErrors();
            hideSuccessMessage();
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            clearErrors();
            hideSuccessMessage();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('loginUsernameError', '请输入用户名和密码');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="loading"></span>登录中...';

            try {
                // 使用 FormData 格式发送（OAuth2 密码流要求）
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });

                // 检查响应状态
                if (response.status === 404) {
                    showError('loginPasswordError', 'API接口未找到，请检查服务器是否正常运行');
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    // 如果不是JSON响应，读取文本
                    const text = await response.text();
                    console.error('响应不是JSON格式:', text);
                    showError('loginPasswordError', `服务器错误: ${response.status} ${response.statusText}`);
                    return;
                }

                if (response.ok) {
                    // 保存 token 和用户信息
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_info', JSON.stringify(data.user));
                    localStorage.setItem('loginUser', data.user.username);
                    
                    // 设置cookie，让服务端中间件可以验证登录状态
                    document.cookie = `access_token=${data.access_token}; path=/; max-age=86400; SameSite=Strict`;
                    
                    const aa = localStorage.getItem('loginUser');
                    console.log('localStorage.getItem loginUser:::', aa);

                    // 直接跳转到index页面，不弹窗
                    window.location.href = '/public/index.html';
                } else {
                    showError('loginPasswordError', data.detail || data.message || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('loginPasswordError', `网络错误: ${error.message}，请检查服务器是否正常运行`);
            } finally {
                loginBtn.disabled = false;
                loginBtnText.textContent = '登录';
            }
        }

        // 处理注册
        async function handleRegister(event) {
            event.preventDefault();
            clearErrors();
            hideSuccessMessage();

            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            // 验证
            if (username.length < 3 || username.length > 50) {
                showError('registerUsernameError', '用户名长度必须在3-50个字符之间');
                return;
            }

            if (!email) {
                showError('registerEmailError', '请输入邮箱');
                return;
            }

            // 简单的邮箱验证
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('registerEmailError', '请输入有效的邮箱地址');
                return;
            }

            if (password.length < 6) {
                showError('registerPasswordError', '密码长度至少6个字符');
                return;
            }

            if (password !== passwordConfirm) {
                showError('registerPasswordConfirmError', '两次输入的密码不一致');
                return;
            }

            const registerBtn = document.getElementById('registerBtn');
            const registerBtnText = document.getElementById('registerBtnText');
            registerBtn.disabled = true;
            registerBtnText.innerHTML = '<span class="loading"></span>注册中...';

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });

                // 检查响应状态
                if (response.status === 404) {
                    showError('registerUsernameError', 'API接口未找到，请检查服务器是否正常运行');
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    // 如果不是JSON响应，读取文本
                    const text = await response.text();
                    console.error('响应不是JSON格式:', text);
                    showError('registerUsernameError', `服务器错误: ${response.status} ${response.statusText}`);
                    return;
                }

                if (response.ok) {
                    showSuccessMessage('注册成功！正在跳转到登录...');
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('loginUsername').value = username;
                    }, 1500);
                } else {
                    const errorMsg = data.detail || data.message || '注册失败';
                    if (errorMsg.includes('用户名')) {
                        showError('registerUsernameError', errorMsg);
                    } else if (errorMsg.includes('邮箱')) {
                        showError('registerEmailError', errorMsg);
                    } else {
                        showError('registerUsernameError', errorMsg);
                    }
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('registerUsernameError', `网络错误: ${error.message}，请检查服务器是否正常运行`);
            } finally {
                registerBtn.disabled = false;
                registerBtnText.textContent = '注册';
            }
        }

        // 显示错误消息
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
                const input = errorElement.previousElementSibling;
                if (input) {
                    input.classList.add('error');
                }
            }
        }

        // 清除所有错误
        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            document.querySelectorAll('input.error').forEach(el => {
                el.classList.remove('error');
            });
        }

        // 显示成功消息
        function showSuccessMessage(message) {
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = message;
            successMsg.classList.add('show');
        }

        // 隐藏成功消息
        function hideSuccessMessage() {
            document.getElementById('successMessage').classList.remove('show');
        }

        // 退出登录
        function logout() {
            // 清除登录相关信息
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            localStorage.removeItem('loginUser');
            // 清除cookie
            document.cookie = 'access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC';
            // 清空输入框
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            
            document.getElementById('userInfo').classList.remove('show');
            document.getElementById('authForms').style.display = 'block';
            clearErrors();
            hideSuccessMessage();
        }

        // 跳转到主页面
        function goToMain() {
            window.location.href = '/public/index.html';
        }
        
        // 切换密码显示/隐藏
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        }
        

        
        // 发送验证码
        function sendVerificationCode() {
            const email = document.getElementById('forgotEmail').value.trim();
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            
            if (!email) {
                document.getElementById('forgotEmailError').textContent = '请输入邮箱';
                document.getElementById('forgotEmailError').classList.add('show');
                return;
            }
            
            // 简单的邮箱验证
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('forgotEmailError').textContent = '请输入有效的邮箱地址';
                document.getElementById('forgotEmailError').classList.add('show');
                return;
            }
            
            // 禁用发送按钮，防止重复点击
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '发送中...';
            
            // 实际发送验证码
            fetch(`${API_BASE_URL}/send-verification-code`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ email: email }).toString()
            })
            .then(response => {
                if (response.status === 404) {
                    throw new Error('API接口未找到，请检查服务器是否正常运行');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    // 显示成功消息
                    alert('验证码已发送到您的邮箱');
                    
                    // 开始倒计时
                    sendCodeBtn.textContent = '60s后重新发送';
                    let countdown = 60;
                    const timer = setInterval(() => {
                        countdown--;
                        sendCodeBtn.textContent = `${countdown}s后重新发送`;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            sendCodeBtn.disabled = false;
                            sendCodeBtn.textContent = '发送验证码';
                        }
                    }, 1000);
                } else {
                    const errorMsg = data.message || '发送验证码失败';
                    document.getElementById('forgotEmailError').textContent = errorMsg;
                    document.getElementById('forgotEmailError').classList.add('show');
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '发送验证码';
                }
            })
            .catch(error => {
                console.error('发送验证码错误:', error);
                document.getElementById('forgotEmailError').textContent = `发送失败: ${error.message}`;
                document.getElementById('forgotEmailError').classList.add('show');
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '发送验证码';
            });
        }
        
        // 处理忘记密码表单提交
        async function handleForgotPassword(event) {
            event.preventDefault();
            
            // 清除错误消息
            document.querySelectorAll('#forgotPasswordForm .error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            
            const email = document.getElementById('forgotEmail').value.trim();
            const verificationCode = document.getElementById('verificationCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            
            // 验证
            if (!email) {
                document.getElementById('forgotEmailError').textContent = '请输入邮箱';
                document.getElementById('forgotEmailError').classList.add('show');
                return;
            }
            
            if (!verificationCode) {
                document.getElementById('verificationCodeError').textContent = '请输入验证码';
                document.getElementById('verificationCodeError').classList.add('show');
                return;
            }
            
            if (newPassword.length < 6) {
                document.getElementById('newPasswordError').textContent = '密码长度至少6个字符';
                document.getElementById('newPasswordError').classList.add('show');
                return;
            }
            
            if (newPassword !== confirmNewPassword) {
                document.getElementById('confirmNewPasswordError').textContent = '两次输入的密码不一致';
                document.getElementById('confirmNewPasswordError').classList.add('show');
                return;
            }
            
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const forgotPasswordBtnText = document.getElementById('forgotPasswordBtnText');
            
            // 禁用按钮，防止重复提交
            forgotPasswordBtn.disabled = true;
            forgotPasswordBtnText.innerHTML = '<span class="loading"></span>重置中...';
            
            try {
                // 准备请求数据
                const requestData = {
                    email: email,
                    verification_code: verificationCode,
                    new_password: newPassword
                };

                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                // 检查响应状态
                if (response.status === 404) {
                    document.getElementById('forgotEmailError').textContent = 'API接口未找到，请检查服务器是否正常运行';
                    document.getElementById('forgotEmailError').classList.add('show');
                    return;
                }

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    // 如果不是JSON响应，读取文本
                    const text = await response.text();
                    console.error('响应不是JSON格式:', text);
                    document.getElementById('forgotEmailError').textContent = `服务器错误: ${response.status} ${response.statusText}`;
                    document.getElementById('forgotEmailError').classList.add('show');
                    return;
                }

                if (response.ok) {
                    // 显示成功消息
                    alert('密码重置成功，请使用新密码登录');
                    // 清空输入框
                    document.getElementById('forgotEmail').value = '';
                    document.getElementById('verificationCode').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmNewPassword').value = '';
                    // 切换回登录表单
                    switchToLogin();
                } else {
                    const errorMsg = data.detail || data.message || '密码重置失败';
                    if (errorMsg.includes('邮箱')) {
                        document.getElementById('forgotEmailError').textContent = errorMsg;
                        document.getElementById('forgotEmailError').classList.add('show');
                    } else if (errorMsg.includes('验证码')) {
                        document.getElementById('verificationCodeError').textContent = errorMsg;
                        document.getElementById('verificationCodeError').classList.add('show');
                    } else if (errorMsg.includes('密码')) {
                        document.getElementById('newPasswordError').textContent = errorMsg;
                        document.getElementById('newPasswordError').classList.add('show');
                    } else {
                        document.getElementById('forgotEmailError').textContent = errorMsg;
                        document.getElementById('forgotEmailError').classList.add('show');
                    }
                }
            } catch (error) {
                console.error('密码重置错误:', error);
                document.getElementById('forgotEmailError').textContent = `网络错误: ${error.message}，请检查服务器是否正常运行`;
                document.getElementById('forgotEmailError').classList.add('show');
            } finally {
                // 启用按钮
                forgotPasswordBtn.disabled = false;
                forgotPasswordBtnText.textContent = '确认重置';
            }
        }
        

    </script>
</body>
</html>
