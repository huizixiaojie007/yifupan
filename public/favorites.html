<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收藏 - 易复盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#60A5FA',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .content-container {
                @apply bg-white rounded-xl shadow-sm p-6 transition-all duration-300;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <div class="content-container">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-dark">我的收藏</h2>
                <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fa fa-plus mr-2"></i>添加收藏
                </button>
            </div>
            
            <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">股票名称</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">股票代码</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">最新价</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">涨跌幅</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">收藏时间</th>
                            <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr>
                            <td class="px-4 py-3">
                                <div class="flex items-center">
                                    <div class="w-2 h-2 bg-green-500 rounded-full mr-2"></div>
                                    <span>科大讯飞</span>
                                </div>
                            </td>
                            <td class="px-4 py-3">002230</td>
                            <td class="px-4 py-3 font-medium">65.28</td>
                            <td class="px-4 py-3 text-green-600">+2.35%</td>
                            <td class="px-4 py-3 text-sm text-gray-500">2026-04-04</td>
                            <td class="px-4 py-3">
                                <div class="flex gap-2">
                                    <button class="text-blue-600 hover:text-blue-800">
                                        <i class="fa fa-eye"></i>
                                    </button>
                                    <button class="text-red-600 hover:text-red-800">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-4 py-3">
                                <div class="flex items-center">
                                    <div class="w-2 h-2 bg-red-500 rounded-full mr-2"></div>
                                    <span>宁德时代</span>
                                </div>
                            </td>
                            <td class="px-4 py-3">300750</td>
                            <td class="px-4 py-3 font-medium">285.60</td>
                            <td class="px-4 py-3 text-red-600">-1.25%</td>
                            <td class="px-4 py-3 text-sm text-gray-500">2026-04-03</td>
                            <td class="px-4 py-3">
                                <div class="flex gap-2">
                                    <button class="text-blue-600 hover:text-blue-800">
                                        <i class="fa fa-eye"></i>
                                    </button>
                                    <button class="text-red-600 hover:text-red-800">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-4 py-3">
                                <div class="flex items-center">
                                    <div class="w-2 h-2 bg-green-500 rounded-full mr-2"></div>
                                    <span>中芯国际</span>
                                </div>
                            </td>
                            <td class="px-4 py-3">688981</td>
                            <td class="px-4 py-3 font-medium">48.72</td>
                            <td class="px-4 py-3 text-green-600">+3.15%</td>
                            <td class="px-4 py-3 text-sm text-gray-500">2026-04-02</td>
                            <td class="px-4 py-3">
                                <div class="flex gap-2">
                                    <button class="text-blue-600 hover:text-blue-800">
                                        <i class="fa fa-eye"></i>
                                    </button>
                                    <button class="text-red-600 hover:text-red-800">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
