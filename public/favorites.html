<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收藏 - 易复盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/extension/dataTool.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#60A5FA',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .content-container {
                @apply bg-white rounded-xl shadow-sm p-6 transition-all duration-300;
            }
            .tab-active {
                @apply border-b-2 border-primary text-primary font-medium;
            }
            .stock-card {
                @apply bg-white border border-gray-200 rounded-lg overflow-hidden transition-all duration-300 hover:shadow-md;
            }
            .stock-card:hover {
                @apply transform -translate-y-1;
            }
            .timeline-item {
                @apply relative pb-8;
            }
            .timeline-item::before {
                content: '';
                @apply absolute left-3 top-0 bottom-0 w-0.5 bg-gray-200;
            }
            .timeline-item:last-child::before {
                @apply hidden;
            }
            .timeline-dot {
                @apply absolute left-0 top-1 w-6 h-6 bg-primary rounded-full flex items-center justify-center text-white text-xs font-bold;
            }
            .time-sector {
                @apply flex items-center gap-2 text-xs;
            }
            .stock-name {
                @apply font-semibold text-base mb-1;
            }
            .reason {
                @apply text-xs text-gray-600 line-clamp-2;
            }
            .score-info {
                @apply font-bold text-orange-500 text-lg;
            }
            .sector-info {
                @apply px-2 py-0.5 rounded text-xs font-medium;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <div class="content-container">
            <!-- Tab切换 -->
            <div class="border-b border-gray-200 mb-6">
                <ul class="flex space-x-8">
                    <li>
                        <button id="tab-my" class="tab-active py-3 px-1 border-b-2 border-transparent transition-all duration-300">
                            我的
                        </button>
                    </li>
                    <li>
                        <button id="tab-consensus" class="py-3 px-1 border-b-2 border-transparent transition-all duration-300">
                            共识
                        </button>
                    </li>
                </ul>
            </div>
            
            <!-- 我的收藏内容 -->
            <div id="content-my" class="block">
                <!-- 时间轴 -->
                <div id="timeline-container-my" class="space-y-8">
                    <!-- 时间轴内容将通过JavaScript动态生成 -->
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-spinner fa-spin text-4xl mb-4"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
            
            <!-- 共识收藏内容 -->
            <div id="content-consensus" class="hidden">
                <!-- 时间轴 -->
                <div id="timeline-container-consensus" class="space-y-8">
                    <!-- 时间轴内容将通过JavaScript动态生成 -->
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-spinner fa-spin text-4xl mb-4"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module">
        console.log('模块开始加载');
        
        // 导入API函数
        import {
            fetchStockCollectionStatus,
            fetchStockDetails,
            fetchStockKlineData,
            getStockInfo
        } from './js/api/stockApi.js';
        
        import AppState from './js/state/appState.js';
        import { formatDateToYmd, formatDateToMd } from './js/utils/dateUtils.js';
        import { getColorBySector, getContrastColor } from './js/utils/colorUtils.js';
        import { trimStr, safeStr } from './js/utils/stringUtils.js';
        import { sectorTooltip } from './js/components/SectorTooltip.js';
        import { stockDetailPopup } from './js/components/StockDetailPopup.js';
        
        console.log('模块加载完成');
        console.log('fetchStockCollectionStatus:', typeof fetchStockCollectionStatus);
        
        // 全局变量
        let dynamicSectorColorMap = {};
        
        // Tab切换功能
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成，开始初始化标签切换');
            const tabMy = document.getElementById('tab-my');
            const tabConsensus = document.getElementById('tab-consensus');
            const contentMy = document.getElementById('content-my');
            const contentConsensus = document.getElementById('content-consensus');
            
            console.log('获取标签元素:', { tabMy, tabConsensus, contentMy, contentConsensus });
            
            if (tabMy) {
                tabMy.addEventListener('click', function() {
                    console.log('点击了我的标签');
                    tabMy.classList.add('tab-active');
                    tabConsensus.classList.remove('tab-active');
                    contentMy.classList.remove('hidden');
                    contentConsensus.classList.add('hidden');
                    loadMyFavorites();
                });
            }
            
            if (tabConsensus) {
                tabConsensus.addEventListener('click', async function() {
                    console.log('点击了共识标签，准备调用loadConsensusFavorites');
                    tabConsensus.classList.add('tab-active');
                    tabMy.classList.remove('tab-active');
                    contentConsensus.classList.remove('hidden');
                    contentMy.classList.add('hidden');
                    try {
                        console.log('开始调用loadConsensusFavorites');
                        await loadConsensusFavorites();
                        console.log('loadConsensusFavorites调用完成');
                    } catch (error) {
                        console.error('loadConsensusFavorites调用失败:', error);
                    }
                });
            }
            
            // 初始加载我的收藏
            console.log('初始加载我的收藏');
            loadMyFavorites();
        });
        
        // 缓存键
        const CACHE_KEY = 'favorites_cache';
        const CACHE_EXPIRY = 3600000; // 缓存过期时间：1小时
        
        // 保存数据到缓存
        function saveToCache(data, type = 'my') {
            try {
                const cacheKey = `${CACHE_KEY}_${type}`;
                const cacheData = {
                    data: data,
                    timestamp: Date.now()
                };
                localStorage.setItem(cacheKey, JSON.stringify(cacheData));
                console.log('数据已保存到缓存:', type);
            } catch (error) {
                console.error('保存缓存失败:', error);
            }
        }
        
        // 从缓存读取数据
        function getFromCache(type = 'my') {
            try {
                const cacheKey = `${CACHE_KEY}_${type}`;
                const cacheStr = localStorage.getItem(cacheKey);
                if (!cacheStr) return null;
                
                const cacheData = JSON.parse(cacheStr);
                const now = Date.now();
                
                // 检查缓存是否过期
                if (now - cacheData.timestamp > CACHE_EXPIRY) {
                    console.log('缓存已过期:', type);
                    localStorage.removeItem(cacheKey);
                    return null;
                }
                
                console.log('从缓存读取数据:', type);
                return cacheData.data;
            } catch (error) {
                console.error('读取缓存失败:', error);
                return null;
            }
        }
        
        // 获取当前激活的timeline-container
        function getActiveTimelineContainer() {
            // 检查哪个tab是激活的
            const tabMy = document.getElementById('tab-my');
            const tabConsensus = document.getElementById('tab-consensus');
            
            // 尝试直接获取两个容器
            const myContainer = document.getElementById('timeline-container-my');
            const consensusContainer = document.getElementById('timeline-container-consensus');
            
            if (tabMy.classList.contains('tab-active') && myContainer) {
                // 我的tab激活
                return myContainer;
            } else if (tabConsensus.classList.contains('tab-active') && consensusContainer) {
                // 共识tab激活
                return consensusContainer;
            }
            // 如果都没有激活，返回共识容器（因为我们主要修复共识页面的问题）
            if (consensusContainer) {
                return consensusContainer;
            }
            // 默认返回我的容器
            return myContainer;
        }
        
        // 渲染时间轴
        function renderTimeline(stocksByDate, isConsensus = false) {
            const timelineContainer = getActiveTimelineContainer();
            console.log('使用的timeline-container:', timelineContainer, 'isConsensus:', isConsensus);
            if (!timelineContainer) {
                console.error('找不到活跃的timeline-container');
                return;
            }
            
            timelineContainer.innerHTML = '';
            
            // 按日期倒序排列
            const sortedDates = Object.keys(stocksByDate).sort((a, b) => new Date(b) - new Date(a));
            console.log('排序后的日期:', sortedDates);
            
            // 默认展开最近5个日期
            for (let i = 0; i < sortedDates.length; i++) {
                const date = sortedDates[i];
                const stocks = stocksByDate[date];
                const isExpanded = i < 5; // 最近5个日期默认展开
                console.log('创建时间轴项目，日期:', date, '股票数量:', stocks.length, 'isConsensus:', isConsensus);
                const timelineItem = createTimelineItem(date, stocks, isExpanded, isConsensus);
                timelineContainer.appendChild(timelineItem);
                
                // 如果是展开状态，在添加到DOM后加载数据
                if (isExpanded) {
                    const dateObj = new Date(date);
                    const dateStr = formatDateToYmd(dateObj);
                    console.log('加载股票详情，日期:', date, 'isConsensus:', isConsensus);
                    loadStockDetails(date, stocks, dateStr, isConsensus);
                }
            }
        }
        
        // 加载共识收藏
        async function loadConsensusFavorites() {
            // 检查是否在iframe中
            const isInIframe = window.self !== window.top;
            console.log('是否在iframe中:', isInIframe);
            
            // 等待页面完全加载
            if (isInIframe) {
                console.log('在iframe中，等待页面完全加载...');
                await new Promise(resolve => {
                    if (document.readyState === 'complete') {
                        resolve();
                    } else {
                        window.addEventListener('load', resolve);
                    }
                });
                
                // 额外等待iframe尺寸稳定
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            const timelineContainer = getActiveTimelineContainer();
            console.log('共识收藏使用的timeline-container:', timelineContainer);
            if (!timelineContainer) {
                console.error('找不到活跃的timeline-container');
                return;
            }
            timelineContainer.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    <i class="fa fa-spinner fa-spin text-4xl mb-4"></i>
                    <p>加载中...</p>
                </div>
            `;
            
            try {
                console.log('开始加载共识收藏');
                // 强制清除缓存，确保获取最新数据
                console.log('尝试清除缓存');
                try {
                    const cacheKey = 'favorites_cache_consensus';
                    console.log('缓存键:', cacheKey);
                    localStorage.removeItem(cacheKey);
                    console.log('缓存已清除');
                } catch (error) {
                    console.error('清除缓存失败:', error);
                }
                
                // 强制清除缓存，确保获取最新数据
                try {
                    localStorage.removeItem('favorites_cache_consensus');
                    // 清除所有股票详情缓存（以stock_details_cache_开头的键）
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('stock_details_cache')) {
                            localStorage.removeItem(key);
                        }
                    }
                    console.log('所有缓存已清除');
                } catch (e) {
                    console.error('清除缓存失败:', e);
                }
                
                // 尝试从缓存读取数据（但由于已清除，应该会获取新数据）
                const cachedData = getFromCache('consensus');
                console.log('缓存数据:', cachedData);
                if (cachedData) {
                    console.log('使用缓存数据');
                    renderTimeline(cachedData, true);
                    return;
                }
                
                // 使用专门的共识接口
                console.log('接口URL:', '/api/zhangting/stock/collect/consensus');
                
                try {
                    
                    const response = await fetch('/api/zhangting/stock/collect/consensus', {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    console.log('接口响应状态:', response.status);
                    console.log('接口响应状态文本:', response.statusText);
                    
                    if (!response.ok) {
                        throw new Error(`接口返回错误: ${response.status}`);
                    }
                    
                    const collectionData = await response.json();
                    console.log('收藏数据:', collectionData);
                    
                    if (!collectionData || !Array.isArray(collectionData)) {
                        timelineContainer.innerHTML = `
                            <div class="text-center py-12 text-gray-500">
                                <i class="fa fa-folder-open text-4xl mb-4"></i>
                                <p>暂无收藏股票</p>
                            </div>
                        `;
                        return;
                    }
                    
                    if (collectionData.length === 0) {
                        timelineContainer.innerHTML = `
                            <div class="text-center py-12 text-gray-500">
                                <i class="fa fa-folder-open text-4xl mb-4"></i>
                                <p>暂无收藏股票</p>
                            </div>
                        `;
                        return;
                    }
                    
                    // 直接使用接口返回的数据，按日期分组
                    const stocksByDate = {};
                    
                    collectionData.forEach(stockRecord => {
                        const date = stockRecord.date;
                        if (!stocksByDate[date]) {
                            stocksByDate[date] = [];
                        }
                        stocksByDate[date].push({
                            gp_name: stockRecord.gp_name,
                            date: date,
                            collection_time: new Date().toLocaleTimeString('zh-CN'),
                            collect_count: stockRecord.collect_count || 0
                        });
                    });
                    
                    console.log('按日期分组:', stocksByDate);
                    
                    // 保存到缓存
                    saveToCache(stocksByDate, 'consensus');
                    
                    // 渲染时间轴
                    console.log('调用renderTimeline，isConsensus=true');
                    renderTimeline(stocksByDate, true);
                } catch (apiError) {
                    console.error('接口调用失败:', apiError);
                    timelineContainer.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i class="fa fa-exclamation-circle text-4xl mb-4"></i>
                            <p>接口调用失败</p>
                            <p class="text-xs text-gray-400 mt-2">${apiError.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载收藏失败:', error);
                timelineContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-exclamation-circle text-4xl mb-4"></i>
                        <p>加载失败，请重试</p>
                        <p class="text-xs text-gray-400 mt-2">${error.message}</p>
                    </div>
                `;
            }
        }
        
        // 加载我的收藏
        async function loadMyFavorites() {
            // 检查是否在iframe中
            const isInIframe = window.self !== window.top;
            console.log('是否在iframe中:', isInIframe);
            
            // 等待页面完全加载
            if (isInIframe) {
                console.log('在iframe中，等待页面完全加载...');
                await new Promise(resolve => {
                    if (document.readyState === 'complete') {
                        resolve();
                    } else {
                        window.addEventListener('load', resolve);
                    }
                });
                
                // 额外等待iframe尺寸稳定
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            const timelineContainer = getActiveTimelineContainer();
            console.log('我的收藏使用的timeline-container:', timelineContainer);
            if (!timelineContainer) {
                console.error('找不到活跃的timeline-container');
                return;
            }
            timelineContainer.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    <i class="fa fa-spinner fa-spin text-4xl mb-4"></i>
                    <p>加载中...</p>
                </div>
            `;
            
            try {
                // 总是从API获取最新数据，不使用缓存
                console.log('从API获取最新数据');
                // 清除缓存，确保下次加载时从API获取最新数据
                try {
                    localStorage.removeItem('favorites_data_my');
                    console.log('缓存已清除');
                } catch (error) {
                    console.error('清除缓存失败:', error);
                }
                
                // 暂时使用固定用户"测试呀"来测试接口
                const user = "测试呀";
                console.log('使用固定用户:', user);
                console.log('接口URL:', '/api/zhangting/stock/collect?user=' + encodeURIComponent(user));
                
                try {
                    
                    const response = await fetch('/api/zhangting/stock/collect?user=' + encodeURIComponent(user), {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    console.log('接口响应状态:', response.status);
                    console.log('接口响应状态文本:', response.statusText);
                    
                    if (!response.ok) {
                        throw new Error(`接口返回错误: ${response.status}`);
                    }
                    
                    const collectionData = await response.json();
                    console.log('收藏数据:', collectionData);
                    
                    if (!collectionData || !Array.isArray(collectionData)) {
                        timelineContainer.innerHTML = `
                            <div class="text-center py-12 text-gray-500">
                                <i class="fa fa-folder-open text-4xl mb-4"></i>
                                <p>暂无收藏股票</p>
                            </div>
                        `;
                        return;
                    }
                    
                    if (collectionData.length === 0) {
                        timelineContainer.innerHTML = `
                            <div class="text-center py-12 text-gray-500">
                                <i class="fa fa-folder-open text-4xl mb-4"></i>
                                <p>暂无收藏股票</p>
                            </div>
                        `;
                        return;
                    }
                    
                    // 按日期分组，只保留基本信息，不请求详细数据
                    const stocksByDate = {};
                    collectionData.forEach(stockRecord => {
                        const date = stockRecord.date;
                        if (!stocksByDate[date]) {
                            stocksByDate[date] = [];
                        }
                        stocksByDate[date].push({
                            gp_name: stockRecord.gp_name,
                            date: stockRecord.date,
                            collection_time: stockRecord.create_time || new Date().toLocaleTimeString('zh-CN')
                        });
                    });
                    
                    console.log('按日期分组:', stocksByDate);
                    
                    // 保存到缓存
                    saveToCache(stocksByDate);
                    
                    // 渲染时间轴
                    renderTimeline(stocksByDate, false);
                } catch (apiError) {
                    console.error('接口调用失败:', apiError);
                    timelineContainer.innerHTML = `
                        <div class="text-center py-12 text-gray-500">
                            <i class="fa fa-exclamation-circle text-4xl mb-4"></i>
                            <p>接口调用失败</p>
                            <p class="text-xs text-gray-400 mt-2">${apiError.message}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('加载收藏失败:', error);
                timelineContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fa fa-exclamation-circle text-4xl mb-4"></i>
                        <p>加载失败，请重试</p>
                        <p class="text-xs text-gray-400 mt-2">${error.message}</p>
                    </div>
                `;
            }
        }
        
        // 按日期分组股票
        function groupStocksByDate(stocks) {
            const grouped = {};
            stocks.forEach(stock => {
                const date = stock.date || stock.collection_date;
                if (date) {
                    if (!grouped[date]) {
                        grouped[date] = [];
                    }
                    grouped[date].push(stock);
                }
            });
            return grouped;
        }
        
        // 创建时间轴项目
        function createTimelineItem(date, stocks, isExpanded, isConsensus = false) {
            console.log('创建时间轴项目，isConsensus:', isConsensus, '股票数量:', stocks.length);
            const timelineItem = document.createElement('div');
            timelineItem.className = 'timeline-item';
            
            const dateObj = new Date(date);
            const day = dateObj.getDate();
            const dateStr = formatDateToYmd(dateObj);
            const collapseId = `collapse-${dateStr.replace(/-/g, '')}`;
            
            // 生成股票名称列表（收缩状态不显示徽章）
            const stockNamesHtml = stocks.map(stock => {
                return `
                <div class="flex items-center gap-2 py-1">
                    <i class="fa fa-angle-right text-primary text-xs"></i>
                    <span class="text-sm">${stock.gp_name || stock.name}</span>
                </div>
            `;
            }).join('');
            
            timelineItem.innerHTML = `
                <div class="relative pl-8 pb-8">
                    <div class="timeline-dot">${day}</div>
                    <div>
                        <div class="flex items-center gap-2 mb-4">
                            <h3 class="text-lg font-semibold">${dateStr}</h3>
                            <button class="flex items-center gap-1 text-primary hover:text-blue-700 transition-colors expand-toggle" data-target="${collapseId}">
                                <i class="fa ${isExpanded ? 'fa-chevron-up' : 'fa-chevron-down'}"></i>
                                <span class="text-xs">${isExpanded ? '收起' : '展开'}</span>
                            </button>
                        </div>
                        <!-- 收缩状态显示的股票名称列表 -->
                        <div id="${collapseId}-names" class="${isExpanded ? 'hidden' : 'block mb-4'}">
                            ${stockNamesHtml}
                        </div>
                        <!-- 展开状态显示的完整卡片 -->
                        <div id="${collapseId}" class="${isExpanded ? 'block' : 'hidden'}">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="stock-grid-${dateStr}">
                                <div class="text-center py-8 text-gray-500">
                                    <i class="fa fa-spinner fa-spin text-2xl mb-2"></i>
                                    <p>加载中...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 添加展开/收缩事件
            const toggleButton = timelineItem.querySelector('.expand-toggle');
            const collapseContent = timelineItem.querySelector(`#${collapseId}`);
            const stockNamesContent = timelineItem.querySelector(`#${collapseId}-names`);
            
            // 展开状态的处理在loadMyFavorites函数中进行，确保元素先添加到DOM
            
            toggleButton.addEventListener('click', async (e) => {
                e.preventDefault();
                const isCurrentlyExpanded = collapseContent.classList.contains('block');
                
                if (isCurrentlyExpanded) {
                    // 收缩状态
                    collapseContent.classList.remove('block');
                    collapseContent.classList.add('hidden');

        // 安全初始化K线图的函数
        function safeInitKlineChart(gpNo, chartDom, collectDate, retries = 20) {
            console.log('=== 安全初始化K线图:', gpNo, '，尝试次数:', 21 - retries, '===');
            console.log('图表容器:', chartDom);
            console.log('收藏日期:', collectDate);
            
            if (!chartDom) {
                console.error('图表容器不存在');
                return;
            }
            
            // 检查是否在iframe中
            const isInIframe = window.self !== window.top;
            console.log('是否在iframe中:', isInIframe);
            
            // 确保容器是可见的
            let current = chartDom;
            let isVisible = true;
            while (current && current !== document.body) {
                const style = window.getComputedStyle(current);
                if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') {
                    isVisible = false;
                    break;
                }
                current = current.parentElement;
            }
            
            if (!isVisible) {
                console.log('容器不可见，等待重试...');
                if (retries > 0) {
                    setTimeout(() => safeInitKlineChart(gpNo, chartDom, collectDate, retries - 1), 300);
                } else {
                    console.error('容器始终不可见，无法初始化图表');
                    chartDom.innerHTML = '<div class="flex items-center justify-center h-40 text-gray-400 text-sm">图表容器不可见</div>';
                }
                return;
            }
            
            // 检查容器尺寸
            const width = chartDom.offsetWidth;
            const height = chartDom.offsetHeight;
            console.log('容器尺寸:', { width, height });
            
            if (width === 0 || height === 0) {
                if (retries > 0) {
                    console.log('容器尺寸为0，等待重试...');
                    // 使用requestAnimationFrame确保在浏览器渲染后检查尺寸
                    requestAnimationFrame(() => {
                        setTimeout(() => safeInitKlineChart(gpNo, chartDom, collectDate, retries - 1), 200);
                    });
                } else {
                    console.error('容器尺寸始终为0，强制设置固定尺寸并使用ResizeObserver监控');
                    // 强制设置固定尺寸
                    chartDom.style.width = '100%';
                    chartDom.style.height = '160px';
                    chartDom.style.minWidth = '300px';
                    chartDom.style.minHeight = '160px';
                    chartDom.style.boxSizing = 'border-box';
                    chartDom.style.position = 'relative';
                    
                    // 强制触发重排
                    chartDom.offsetHeight;
                    
                    // 使用ResizeObserver监听尺寸变化
                    const resizeObserver = new ResizeObserver(entries => {
                        for (const entry of entries) {
                            const { width, height } = entry.contentRect;
                            if (width > 0 && height > 0) {
                                console.log('ResizeObserver: 容器尺寸有效:', { width, height });
                                resizeObserver.disconnect();
                                initKlineChart(gpNo, chartDom, collectDate);
                                return;
                            }
                        }
                    });
                    
                    resizeObserver.observe(chartDom);
                    
                    // 2秒后如果还没有尺寸，显示错误
                    setTimeout(() => {
                        resizeObserver.disconnect();
                        const finalWidth = chartDom.offsetWidth;
                        const finalHeight = chartDom.offsetHeight;
                        if (finalWidth === 0 || finalHeight === 0) {
                            console.error('强制设置尺寸后仍然为0，无法初始化图表');
                            chartDom.innerHTML = '<div class="flex items-center justify-center h-40 text-gray-400 text-sm">图表容器尺寸异常</div>';
                        }
                    }, 2000);
                }
                return;
            }
            
            // 尺寸正常，初始化图表
            initKlineChart(gpNo, chartDom, collectDate);
        }
        
        // 初始化K线图
        async function initKlineChart(gpNo, chartDom, collectDate) {
            console.log('=== 初始化K线图:', gpNo, '===');
            console.log('图表容器:', chartDom);
            console.log('容器尺寸:', chartDom ? { width: chartDom.offsetWidth, height: chartDom.offsetHeight } : '无');
            console.log('收藏日期:', collectDate);
            
            if (!chartDom) {
                console.error('图表容器不存在');
                return;
            }
            
            try {
                // 尝试从缓存读取K线数据
                let klineData = getKlineDataFromCache(gpNo);
                
                // 如果缓存不存在或已过期，从API获取数据
                if (!klineData) {
                    console.log('获取K线数据:', gpNo);
                    klineData = await fetchStockKlineData(gpNo, 60);
                    console.log('K线数据长度:', klineData ? klineData.length : 0);
                    console.log('K线数据前5条:', klineData ? klineData.slice(0, 5) : '无');
                    
                    // 保存到缓存
                    if (klineData && klineData.length > 0) {
                        saveKlineDataToCache(gpNo, klineData);
                    }
                } else {
                    console.log('使用缓存的K线数据:', gpNo);
                    console.log('缓存K线数据长度:', klineData.length);
                }
                
                if (klineData && klineData.length > 0) {
                    console.log('创建ECharts实例:', gpNo);
                    const myChart = echarts.init(chartDom);
                    console.log('ECharts实例创建成功:', myChart);
                    console.log('ECharts实例ID:', myChart.id);
                    
                    // 提取日期并格式化
                    const dates = klineData.map(item => {
                        const d = new Date(item[0]);
                        return `${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
                    });
                    
                    // 准备K线数据
                    const candlestickData = klineData.map(item => [
                        parseFloat(item[1]), // 开盘价
                        parseFloat(item[2]), // 收盘价
                        parseFloat(item[3]), // 最低价
                        parseFloat(item[4])  // 最高价
                    ]);
                    
                    // 计算5日均线和10日均线
                    const calculateMA = (data, dayCount) => {
                        const result = [];
                        for (let i = 0; i < data.length; i++) {
                            if (i < dayCount - 1) {
                                result.push('-');
                                continue;
                            }
                            let sum = 0;
                            for (let j = 0; j < dayCount; j++) {
                                sum += data[i - j][1];
                            }
                            result.push((sum / dayCount).toFixed(2));
                        }
                        return result;
                    };
                    
                    const ma5 = calculateMA(candlestickData, 5);
                    const ma10 = calculateMA(candlestickData, 10);
                    
                    // 准备成交量数据
                    const volumeData = klineData.map(item => parseFloat(item[5]));
                    
                    // 准备收藏日期标记数据
                    let markLineData = [];
                    if (collectDate) {
                        console.log('处理收藏日期:', collectDate);
                        // 查找收藏日期在K线数据中的索引
                        const collectDateObj = new Date(collectDate);
                        const collectDateStr = collectDateObj.toISOString().split('T')[0];
                        console.log('收藏日期字符串:', collectDateStr);
                        
                        // 查找收藏日期在K线数据中的索引
                        let collectDateIndex = klineData.findIndex(item => {
                            const itemDate = new Date(item[0]);
                            const itemDateStr = itemDate.toISOString().split('T')[0];
                            console.log('K线数据日期:', itemDateStr);
                            return itemDateStr === collectDateStr;
                        });
                        
                        // 如果找不到精确匹配的日期，找到最接近的日期
                        if (collectDateIndex === -1) {
                            console.log('未找到精确匹配的日期，查找最接近的日期');
                            const collectDateTimestamp = collectDateObj.getTime();
                            let closestIndex = -1;
                            let minDiff = Infinity;
                            
                            for (let i = 0; i < klineData.length; i++) {
                                const itemDate = new Date(klineData[i][0]);
                                const diff = Math.abs(itemDate.getTime() - collectDateTimestamp);
                                if (diff < minDiff) {
                                    minDiff = diff;
                                    closestIndex = i;
                                }
                            }
                            
                            if (closestIndex !== -1) {
                                collectDateIndex = closestIndex;
                                console.log('找到最接近的日期索引:', collectDateIndex);
                            }
                        }
                        
                        if (collectDateIndex !== -1) {
                            console.log('找到收藏日期索引:', collectDateIndex);
                            // 添加收藏日期标记
                            markLineData = [{
                                name: '收藏日期',
                                xAxis: collectDateIndex,
                                lineStyle: {
                                    color: '#ff9800',
                                    width: 2,
                                    type: 'dashed'
                                },
                                label: {
                                    show: true,
                                    formatter: '收藏',
                                    position: 'top',
                                    color: '#ff9800',
                                    fontSize: 10
                                }
                            }];
                            console.log('标记线数据:', markLineData);
                        } else {
                            console.log('未找到收藏日期在K线数据中');
                        }
                    }
                    
                    const option = {
                        grid: [
                            {
                                left: '3%',
                                right: '3%',
                                top: '2%',
                                bottom: '32%',
                                containLabel: true
                            },
                            {
                                left: '3%',
                                right: '3%',
                                top: '70%',
                                bottom: '4%',
                                containLabel: true
                            }
                        ],
                        xAxis: [
                            {
                                type: 'category',
                                gridIndex: 0,
                                data: dates,
                                axisLabel: { show: false },
                                axisTick: { show: false },
                                splitLine: { show: false }
                            },
                            {
                                type: 'category',
                                gridIndex: 1,
                                data: dates,
                                axisLabel: {
                                    fontSize: 8,
                                    interval: Math.floor(dates.length / 5),
                                    rotate: 0
                                },
                                axisTick: { alignWithLabel: true },
                                splitLine: { show: false }
                            }
                        ],
                        yAxis: [
                            {
                                type: 'value',
                                gridIndex: 0,
                                scale: true,
                                axisLabel: { fontSize: 10 },
                                splitLine: { lineStyle: { color: '#eee' } }
                            },
                            {
                                type: 'value',
                                gridIndex: 1,
                                scale: true,
                                axisLabel: { show: true, formatter: '  ' }
                            }
                        ],
                        series: [
                            {
                                type: 'candlestick',
                                name: 'K线',
                                xAxisIndex: 0,
                                yAxisIndex: 0,
                                data: candlestickData,
                                itemStyle: {
                                    color: '#ef4444',
                                    color0: '#22c55e',
                                    borderColor: '#ef4444',
                                    borderColor0: '#22c55e'
                                },
                                barWidth: '45%',
                                markLine: {
                                    symbol: 'none',
                                    data: markLineData
                                }
                            },
                            {
                                type: 'line',
                                name: 'MA5',
                                xAxisIndex: 0,
                                yAxisIndex: 0,
                                data: ma5,
                                smooth: true,
                                showSymbol: false,
                                lineStyle: {
                                    width: 1,
                                    color: '#FF7F50'
                                }
                            },
                            {
                                type: 'line',
                                name: 'MA10',
                                xAxisIndex: 0,
                                yAxisIndex: 0,
                                data: ma10,
                                smooth: true,
                                showSymbol: false,
                                lineStyle: {
                                    width: 1,
                                    color: '#1E90FF'
                                }
                            },
                            {
                                type: 'bar',
                                name: '成交量',
                                xAxisIndex: 1,
                                yAxisIndex: 1,
                                data: volumeData,
                                itemStyle: {
                                    color: params => {
                                        const dataIndex = params.dataIndex;
                                        const klineData = candlestickData[dataIndex];
                                        return klineData[1] > klineData[0] ? '#ef4444' : '#22c55e';
                                    }
                                },
                                barWidth: '60%'
                            }
                        ]
                    };
                    
                    console.log('设置ECharts选项:', gpNo);
                    myChart.setOption(option);
                    console.log('ECharts选项设置完成:', gpNo);
                    
                    // 确保容器宽度正确
                    setTimeout(() => {
                        console.log('强制调整容器尺寸前:', { width: chartDom.offsetWidth, height: chartDom.offsetHeight });
                        
                        // 强制设置容器宽度为卡片宽度
                        const cardWidth = chartDom.parentElement.offsetWidth;
                        console.log('卡片宽度:', cardWidth);
                        
                        if (cardWidth > 0) {
                            chartDom.style.width = cardWidth + 'px';
                            console.log('调整后容器宽度:', chartDom.offsetWidth);
                        }
                        
                        // 强制渲染
                        myChart.resize();
                        console.log('ECharts图表渲染完成:', gpNo);
                    }, 100);
                    
                    // 窗口resize适配
                    window.addEventListener('resize', () => {
                        console.log('窗口 resize，重绘图表:', gpNo);
                        myChart.resize();
                    });
                } else {
                    chartDom.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400 text-sm">暂无K线数据</div>';
                }
            } catch (error) {
                console.error('初始化K线图失败:', error);
                chartDom.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400 text-sm">K线数据加载失败</div>';
            }
        }
    </script>
</body>
