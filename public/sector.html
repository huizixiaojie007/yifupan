<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票板块封板接力分析</title>
    <!-- 外部依赖 -->
    <link href="css/output.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- K线图：ECharts -->
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/extension/dataTool.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 主内容区 -->
    <main class="container">
        <!-- 1. 板块直方图 -->
        <div id="sectorHistogramContainer" class="bg-white shadow-md rounded-lg p-4 mb-6">
            <div id="sectorHistogram" class="w-full h-90"></div>
        </div>

        <!-- 2. 板块抽屉区（多个可展开抽屉） -->
        <div id="sectorsDrawerContainer" class="bg-white shadow-md rounded-lg p-4 mb-6">
            <div class="flex items-center justify-between text-lg font-semibold text-gray-700 mb-4">
                <h2>题材/板块列表（点击展开/收起）</h2>
                <div class="flex items-center space-x-3">
                    <button id="collapseAllBtn" class="px-3 py-1.5 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors flex items-center text-sm">
                        <i class="fa fa-compress mr-1.5"></i> 全部收起
                    </button>
                </div>
            </div>
            <div id="sectorsList" class="space-y-3">
                <!-- 板块抽屉将通过JS动态渲染 -->
                <div class="text-center text-gray-500 py-6">
                    <i class="fa fa-spinner fa-spin mr-2"></i> 加载板块数据中...
                </div>
            </div>
        </div>

    </main>

    <!-- 加载中遮罩 -->
    <div id="loadingMask" class="fixed inset-0 bg-black bg-opacity-30 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-lg flex flex-col items-center">
            <i class="fa fa-spinner fa-spin text-2xl text-blue-500 mb-3"></i>
            <p class="text-gray-700">加载数据中，请稍候...</p>
        </div>
    </div>
    <script type="module" src="js/renderer/sectorRender.js"></script>
</body>
</html>
