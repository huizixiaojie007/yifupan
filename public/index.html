<!DOCTYPE html>

<head>

    <title>易复盘</title>
    <script>
        function checkLogin() {
            const accessToken = localStorage.getItem('access_token');
            const userInfo = localStorage.getItem('user_info');
            if (!accessToken || !userInfo) {
                window.location.href = '/public/login.html';
                return false;
            }
            return true;
        }
        checkLogin();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const navLinks = document.querySelectorAll('.nav-link');
            const contentSections = document.querySelectorAll('.content-section');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleBtn = document.getElementById('toggleSidebar');
            const toggleIcon = toggleBtn.querySelector('i');
            const loadedPages = new Set();

            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();

                    const targetId = this.getAttribute('data-target');

                    if (this.classList.contains('active')) {
                        return;
                    }

                    navLinks.forEach(navLink => {
                        navLink.classList.remove('active');
                    });

                    this.classList.add('active');

                    contentSections.forEach(section => {
                        section.classList.add('hidden');
                        section.classList.remove('active');
                    });

                    const targetSection = document.getElementById(targetId);
                    if (targetSection) {
                        targetSection.classList.remove('hidden');
                        targetSection.classList.add('active');

                        if (targetId !== 'home') {
                            const iframe = targetSection.querySelector('iframe');
                            if (iframe) {
                                const dataSrc = iframe.getAttribute('data-src');
                                if (!loadedPages.has(targetId) && dataSrc) {
                                    iframe.src = dataSrc;
                                    loadedPages.add(targetId);
                                }
                            }
                        }

                        let targetUrl = '/public/index.html';
                        switch(targetId) {
                            case 'limitup':
                                targetUrl = '/public/limitup.html';
                                break;
                            case 'theme':
                                targetUrl = '/public/sector.html';
                                break;
                            case 'board':
                                targetUrl = '/public/board_info.html';
                                break;
                            case 'history':
                                targetUrl = '/public/stock_mining.html';
                                break;
                            case 'favorites':
                                targetUrl = '/public/favorites.html';
                                break;
                            case 'recommendation':
                                targetUrl = '/public/recommendation.html';
                                break;
                            case 'admin':
                                targetUrl = '/public/admin.html';
                                break;
                            default:
                                targetUrl = '/public/index.html';
                        }

                        history.pushState({page: targetId}, '', targetUrl);
                    }
                });
            });

            toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('sidebar-collapsed');
                mainContent.classList.toggle('main-expanded');

                if (sidebar.classList.contains('sidebar-collapsed')) {
                    toggleIcon.classList.remove('fa-chevron-left');
                    toggleIcon.classList.add('fa-chevron-right');
                    toggleBtn.title = '展开';
                } else {
                    toggleIcon.classList.remove('fa-chevron-right');
                    toggleIcon.classList.add('fa-chevron-left');
                    toggleBtn.title = '收起';
                }

                const limitupIframe = document.querySelector('#limitup iframe');
                if (limitupIframe && limitupIframe.contentWindow) {
                    limitupIframe.contentWindow.postMessage('sidebarStateChanged', '*');
                }

                // 侧边栏收起/展开后重绘首页图表（宽度变化不触发window.resize）
                if (typeof refreshHomeChartsSize === 'function') {
                    setTimeout(refreshHomeChartsSize, 350);
                }
            });

            const userMenuBtn = document.getElementById('userMenuBtn');
            const userModal = document.getElementById('userModal');
            const closeUserModal = document.getElementById('closeUserModal');

            userMenuBtn.addEventListener('click', function() {
                userModal.classList.remove('hidden');
            });

            closeUserModal.addEventListener('click', function() {
                userModal.classList.add('hidden');
            });

            userModal.addEventListener('click', function(e) {
                if (e.target === userModal) {
                    userModal.classList.add('hidden');
                }
            });

            loadUserInfo();

            window.addEventListener('popstate', function(e) {
                if (e.state && e.state.page) {
                    const targetId = e.state.page;

                    navLinks.forEach(navLink => {
                        navLink.classList.remove('active');
                    });

                    const activeLink = document.querySelector(`.nav-link[data-target="${targetId}"]`);
                    if (activeLink) {
                        activeLink.classList.add('active');
                    }

                    contentSections.forEach(section => {
                        section.classList.add('hidden');
                        section.classList.remove('active');
                    });

                    const targetSection = document.getElementById(targetId);
                    if (targetSection) {
                        targetSection.classList.remove('hidden');
                        targetSection.classList.add('active');

                        if (targetId !== 'home') {
                            const iframe = targetSection.querySelector('iframe');
                            if (iframe) {
                                const dataSrc = iframe.getAttribute('data-src');
                                if (!loadedPages.has(targetId) && dataSrc) {
                                    iframe.src = dataSrc;
                                    loadedPages.add(targetId);
                                }
                            }
                        }
                    }
                }
            });
        });

        function handleLogout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            localStorage.removeItem('loginUser');
            document.cookie = 'access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC';

    <!-- 首页市场图表：涨跌分布饼图 + 指数K线 -->
    <script>
        let marketIndexData = [];      // get_market_index_list 返回的指数实时数据
        let marketUpDownStat = null;   // 沪深两市涨跌分布统计（/market/updown）
        let marketLimitIndicator = []; // 指标精选数据（/market/limit_indicator）
        let marketPieChart = null;     // 涨跌分布饼图实例
        let indexKlineChart = null;    // 指数K线图实例
        let fundflowChart = null;      // 大盘资金流向折线图实例
        let fundflowDays = 30;         // 资金流向默认显示天数（日线模式）
        let fundflowMode = 'day';      // 'day' 日线 / 'today' 今日分时
        let marginChart = null;        // 融资净买入直方图实例
        let marginDays = 60;           // 融资净买入默认显示天数（60天）
        let fundflowRankPeriod = 'today';  // 个股资金流向排行周期：today/5/10
        let sectorFundflowPeriod = 'today';  // 行业板块资金流向周期：today/5/10

        // ===== 三个模块的K线卡片状态 =====
        let sectorFundflowData = [];   // 板块净流入最近一次数据
        let fundflowRankData = [];     // 主力占比最近一次数据
        let fundflowDetailData = [];   // 主力净流入最近一次数据
        const klineCardDataCache = {};    // key(代码/secid) → K线数组
        const klineCardInstances = {};    // chartDomId → echarts实例
        const klineCardExpanded = { sector: false, rank: false, detail: false };
        let klineCardSeq = 0;             // 卡片唯一序号

        const toNum = v => {
            const n = parseFloat(v);
            return isNaN(n) ? 0 : n;
        };

        // 初始化首页图表
        async function initHomeMarketCharts() {
            if (!window.echarts) {
                console.error('echarts未加载，无法渲染首页图表');
                return;
            }
            const pieDom = document.getElementById('marketPieChart');
            const klineDom = document.getElementById('indexKlineChart');
            const ffDom = document.getElementById('fundflowChart');
            const mgDom = document.getElementById('marginChart');
            if (pieDom) marketPieChart = echarts.init(pieDom);
            if (klineDom) indexKlineChart = echarts.init(klineDom);
            if (ffDom) fundflowChart = echarts.init(ffDom);
            if (mgDom) marginChart = echarts.init(mgDom);

            bindFundflowDayTabs();
            bindMarginDayTabs();
            bindSectorFundflowPeriodTabs();
            bindFundflowRankPeriodTabs();
            bindFundflowDetailPeriodTabs();
            bindKlineExpandButtons();
            await loadMarketIndexData();
            await Promise.all([
                loadFundflowData(fundflowDays),
                loadMarginData(marginDays),
                loadSectorFundflow(sectorFundflowPeriod),
                loadFundflowRank(fundflowRankPeriod),
                loadFundflowDetail('today')
            ]);

            window.addEventListener('resize', refreshHomeChartsSize);
        }

        function refreshHomeChartsSize() {
            if (marketPieChart) marketPieChart.resize();
            if (indexKlineChart) indexKlineChart.resize();
            if (fundflowChart) fundflowChart.resize();
            if (marginChart) marginChart.resize();
            Object.values(klineCardInstances).forEach(c => { try { c.resize(); } catch (e) {} });
        }

        // 资金流向 今日/15/30/60天 切换按钮
        function bindFundflowDayTabs() {
            const bar = document.getElementById('fundflowDays');
            if (!bar) return;
            bar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('button').forEach(b => {
                        b.className = 'px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary';
                    });
                    btn.className = 'px-2 py-1 rounded border border-primary bg-primary text-white';
                    const mode = btn.getAttribute('data-mode') || 'day';
                    fundflowMode = mode;
                    if (mode === 'today') {
                        loadFundflowToday();
                    } else {
                        fundflowDays = Number(btn.getAttribute('data-d')) || 30;
                        loadFundflowData(fundflowDays);
                    }
                });
            });
        }

        async function loadFundflowData(days) {
            if (!fundflowChart) return;
            try {
                const res = await fetch(`/api/zhangting/market/fundflow?days=${days}`, { headers: { 'Content-Type': 'application/json' } });
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json() || [];
                renderFundflowChart(data, 'day');
            } catch (e) {
                console.error('加载资金流向失败:', e);
                renderChartError(fundflowChart, '资金流向数据加载失败');
            }
        }

        async function loadFundflowToday() {
            if (!fundflowChart) return;
            try {
                const res = await fetch('/api/zhangting/market/fundflow/today', { headers: { 'Content-Type': 'application/json' } });
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json() || [];
                renderFundflowChart(data, 'today');
            } catch (e) {
                console.error('加载今日分时资金流向失败:', e);
                renderChartError(fundflowChart, '今日分时资金流向加载失败');
            }
        }

        // 融资买入 30/60 天切换按钮
        function bindMarginDayTabs() {
            const bar = document.getElementById('marginDays');
            if (!bar) return;
            bar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('button').forEach(b => {
                        b.className = 'px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary';
                    });
                    btn.className = 'px-2 py-1 rounded border border-primary bg-primary text-white';
                    marginDays = Number(btn.getAttribute('data-d')) || 30;
                    loadMarginData(marginDays);
                });
            });
        }

        async function loadMarginData(days) {
            if (!marginChart) return;
            try {
                const res = await fetch(`/api/zhangting/market/margin?days=${days}`, { headers: { 'Content-Type': 'application/json' } });
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json() || [];
                renderMarginChart(data);
            } catch (e) {
                console.error('加载两融数据失败:', e);
                renderChartError(marginChart, '两融数据加载失败');
            }
        }

        // 融资净买入直方图（正红柱=净买入，负绿柱=净卖出）
        function renderMarginChart(data) {
            if (!marginChart || !data.length) {
                if (marginChart) renderChartError(marginChart, '暂无两融数据');
                return;
            }
            const xLabel = data.map(d => d['日期']);
            const netData = data.map(d => toNum(d['融资净买入(亿)']));

            marginChart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    valueFormatter: v => (v == null ? v : (v.toFixed ? v.toFixed(2) : v) + ' 亿')
                },
                grid: { left: 48, right: 14, top: 16, bottom: 28 },
                xAxis: {
                    type: 'category', data: xLabel,
                    axisTick: { show: false },
                    axisLabel: { fontSize: 10, color: '#9CA3AF', interval: 'auto' },
                    axisLine: { lineStyle: { color: '#E5E7EB' } }
                },
                yAxis: {
                    type: 'value', name: '融资净买入',
                    nameTextStyle: { color: '#9CA3AF', fontSize: 10 },
                    axisLabel: { fontSize: 10, color: '#9CA3AF' },
                    splitLine: { lineStyle: { color: '#F3F4F6' } },
                    axisLine: { show: false }
                },
                series: [
                    {
                        name: '融资净买入额',
                        type: 'bar',
                        barWidth: '60%',
                        data: netData,
                        itemStyle: {
                            color: params => (params.value >= 0 ? '#EF4444' : '#22C55E'),
                            borderRadius: params => (params.value >= 0 ? [3, 3, 0, 0] : [0, 0, 3, 3])
                        }
                    }
                ]
            }, true);
        }

        // ===== 三个模块：展开K线卡片 =====
        const _escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function bindKlineExpandButtons() {
            // 非有效会员：按钮置灰并提示会员专享
            const vipOk = window.VipGuard && window.VipGuard.isValidVip();
            document.querySelectorAll('button[data-kexpand]').forEach(btn => {
                if (!vipOk) {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.title = '会员专享功能：请开通会员或续费后使用';
                }
                btn.addEventListener('click', () => {
                    const moduleKey = btn.getAttribute('data-kexpand');
                    // 收起不限制；展开查看K线为会员专享
                    if (!klineCardExpanded[moduleKey] && !(window.VipGuard && window.VipGuard.guard('查看K线'))) {
                        return;
                    }
                    if (klineCardExpanded[moduleKey]) {
                        _setExpandBtnStyle(btn, false);
                        collapseKlineCards(moduleKey);
                    } else {
                        _setExpandBtnStyle(btn, true);
                        expandKlineCards(moduleKey);
                    }
                });
            });
        }

        function _setExpandBtnStyle(btn, active) {
            btn.className = active
                ? 'flex items-center gap-1 rounded border border-primary bg-primary px-1.5 py-0.5 text-[11px] text-white transition-colors'
                : 'flex items-center gap-1 rounded border border-primary/40 px-1.5 py-0.5 text-[11px] text-primary transition-colors hover:bg-primary hover:text-white';
        }

        function getKlineCardRecords(moduleKey) {
            if (moduleKey === 'sector') return sectorFundflowData;
            if (moduleKey === 'rank') return fundflowRankData;
            return fundflowDetailData;
        }

        // 模块key → 列表容器id（列表与K线卡片互斥展示）
        function getListBodyId(moduleKey) {
            if (moduleKey === 'sector') return 'sectorFundflowBody';
            if (moduleKey === 'rank') return 'fundflowRankBody';
            return 'fundflowDetailBody';
        }

        // 获取单条记录的K线（缓存Promise，并发展开/重复点击都只发一次请求）
        function fetchKlineCardData(moduleKey, record) {
            const code = record['代码'];
            const key = moduleKey === 'sector' ? '90.' + code : code;
            if (klineCardDataCache[key]) return klineCardDataCache[key];
            const p = moduleKey === 'sector' ? fetchBoardKlineRows(key) : fetchStockKlineRows(code);
            klineCardDataCache[key] = p;
            // 请求失败时移除缓存，允许后续重试
            p.catch(() => { if (klineCardDataCache[key] === p) delete klineCardDataCache[key]; });
            return p;
        }

        // 板块K线：板块分析页同款接口（仅secid，返回中文字段），映射后取最近60个交易日
        async function fetchBoardKlineRows(key) {
            const res = await fetch(`/api/zhangting/board/kline?secid=${encodeURIComponent(key)}`);
            if (!res.ok) throw new Error(res.status);
            const raw = await res.json();
            return (Array.isArray(raw) ? raw : []).map(r => ({
                date: r['日期'],
                open: r['开盘价'],
                high: r['最高价'],
                low: r['最低价'],
                close: r['收盘价'],
                volume: r['成交量']
            })).filter(r => r.date).slice(-60);
        }

        // 个股K线
        async function fetchStockKlineRows(code) {
            const res = await fetch(`/api/zhangting/stock/kline?gp_no=${encodeURIComponent(code)}&days=60`);
            if (!res.ok) throw new Error(res.status);
            return res.json();
        }

        // 并发控制：最多 limit 个任务同时执行
        async function runWithConcurrency(taskFns, limit) {
            const executing = new Set();
            for (const fn of taskFns) {
                const p = fn().finally(() => executing.delete(p));
                executing.add(p);
                if (executing.size >= limit) await Promise.race(executing);
            }
            await Promise.all(executing);
        }

        // 销毁容器内已存在的卡片图表
        function _disposeCardCharts(container) {
            container.querySelectorAll('.kline-card-chart').forEach(dom => {
                if (klineCardInstances[dom.id]) {
                    try { klineCardInstances[dom.id].dispose(); } catch (e) {}
                    delete klineCardInstances[dom.id];
                }
            });
        }

        async function expandKlineCards(moduleKey) {
            klineCardExpanded[moduleKey] = true;
            const container = document.getElementById(moduleKey + 'KlineCards');
            // 隐藏列表，卡片替换上来
            const listBody = document.getElementById(getListBodyId(moduleKey));
            if (listBody) listBody.classList.add('hidden');
            _disposeCardCharts(container);
            container.classList.remove('hidden');

            const records = getKlineCardRecords(moduleKey);
            if (!records.length) {
                container.innerHTML = '<div class="py-4 text-center text-[11px] text-gray-300">暂无数据</div>';
                return;
            }

            // 构建卡片骨架（去掉代码；标题下方展示该记录在收起表格中的关键信息，图表区先放加载提示）
            const metaList = records.map(x => {
                const chartId = `kkc_${moduleKey}_${++klineCardSeq}`;
                // 涨跌幅：正红负绿
                const chg = toNum(x['涨跌幅(%)']);
                const chgCls = chg > 0 ? 'text-red-500' : (chg < 0 ? 'text-green-500' : 'text-gray-400');
                const chgSign = chg > 0 ? '+' : '';
                // 第二行：复用收起状态（表格行）展示的字段
                // rank → 所属板块+主力占比；detail → 所属板块+主力净流入额；sector → 主力净流入额
                let metricHtml;
                if (moduleKey === 'rank') {
                    const pct = toNum(x['主力净流入占比(%)']);
                    const pctCls = pct > 0 ? 'text-red-500' : (pct < 0 ? 'text-green-500' : 'text-gray-400');
                    const sectorName = _escHtml(x['所属板块'] || '-');
                    metricHtml =
                        `<span class="min-w-0 truncate text-[9px] text-gray-400" title="${sectorName}">${sectorName}</span>` +
                        `<span class="shrink-0 text-[10px] ${pctCls}">主力占比 ${pct.toFixed(0)}%</span>`;
                } else {
                    const n = toNum(x['主力净流入额(亿)']);
                    const amtCls = n > 0 ? 'text-red-500' : (n < 0 ? 'text-green-500' : 'text-gray-400');
                    const sign = n > 0 ? '+' : '';
                    const metricName = moduleKey === 'detail' ? '净流入' : '主力净流入';
                    const sectorName = moduleKey === 'detail' ? _escHtml(x['所属板块'] || '-') : '';
                    metricHtml =
                        (moduleKey === 'detail'
                            ? `<span class="min-w-0 truncate text-[9px] text-gray-400" title="${sectorName}">${sectorName}</span>`
                            : '<span></span>') +
                        `<span class="shrink-0 text-[10px] ${amtCls}">${metricName} ${sign}${n.toFixed(2)}亿</span>`;
                }
                const html = `
                <div class="mb-2 rounded-lg border border-gray-200 bg-white p-2 shadow-sm">
                    <div class="mb-0.5 flex items-center justify-between gap-1">
                        <span class="min-w-0 truncate text-xs font-semibold text-gray-700" title="${_escHtml(x['名称'])}">${_escHtml(x['名称'])}</span>
                        <span class="shrink-0 text-[10px] ${chgCls}">${chgSign}${chg.toFixed(2)}%</span>
                    </div>
                    <div class="mb-1 flex items-center justify-between gap-1">${metricHtml}</div>
                    <div class="kline-card-chart relative h-[170px] w-full" id="${chartId}">
                        <div class="absolute inset-0 flex items-center justify-center text-[10px] text-gray-300">加载中...</div>
                    </div>
                </div>`;
                return { chartId, html, record: x };
            });
            container.innerHTML = metaList.map(m => m.html).join('');

            // 并发拉取并渲染图表（单卡片失败不影响其他）
            await runWithConcurrency(metaList.map(meta => async () => {
                const dom = document.getElementById(meta.chartId);
                if (!dom) return;
                try {
                    const rows = await fetchKlineCardData(moduleKey, meta.record);
                    if (!rows || !rows.length) {
                        dom.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-[10px] text-gray-300">暂无K线数据</div>';
                        return;
                    }
                    renderKlineCardChart(dom, rows);
                } catch (e) {
                    dom.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-[10px] text-red-300">加载失败</div>';
                }
            }), 3);
        }

        function collapseKlineCards(moduleKey) {
            klineCardExpanded[moduleKey] = false;
            const container = document.getElementById(moduleKey + 'KlineCards');
            _disposeCardCharts(container);
            container.innerHTML = '';
            container.classList.add('hidden');
            // 恢复列表展示
            const listBody = document.getElementById(getListBodyId(moduleKey));
            if (listBody) listBody.classList.remove('hidden');
        }

        // 紧凑K线卡片：上方K线(含MA5/MA10) + 下方成交量（参考stock_mining/tableRenderer）
        function renderKlineCardChart(dom, rows) {
            if (klineCardInstances[dom.id]) {
                try { klineCardInstances[dom.id].dispose(); } catch (e) {}
            }
            const chart = echarts.init(dom);
            klineCardInstances[dom.id] = chart;

            // 日期原始值YYYY-MM-DD，轴标签通过formatter转mm/dd
            const dates = rows.map(r => r.date);
            const candData = rows.map(r => [r.open, r.close, r.low, r.high]);
            const volData = rows.map(r => ({
                value: r.volume,
                itemStyle: { color: r.close >= r.open ? '#ef4444' : '#22c55e' }
            }));

            // 均线：前 n-1 根无值
            const closes = rows.map(r => r.close);
            const calcMA = n => closes.map((c, i) => {
                if (i < n - 1) return '-';
                let s = 0;
                for (let j = 0; j < n; j++) s += closes[i - j];
                return +(s / n).toFixed(2);
            });
            const ma5 = calcMA(5);
            const ma10 = calcMA(10);

            chart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross', lineStyle: { color: '#9ca3af', width: 0.5 } },
                    textStyle: { fontSize: 9 },
                    padding: [4, 6],
                    formatter: params => {
                        const kp = params.find(p => p.seriesType === 'candlestick');
                        if (!kp) return '';
                        const d = kp.data;
                        const v = rows[kp.dataIndex].volume || 0;
                        let html = `<div style="font-size:9px;color:#6b7280">${kp.axisValue}</div>` +
                            `<div style="font-size:9px">开 ${d[0].toFixed(2)}　收 ${d[1].toFixed(2)}</div>` +
                            `<div style="font-size:9px">低 ${d[2].toFixed(2)}　高 ${d[3].toFixed(2)}</div>` +
                            `<div style="font-size:9px">量 ${(v / 10000).toFixed(0)}万</div>`;
                        // 均线值
                        params.forEach(p => {
                            if (p.seriesType === 'line' && typeof p.value === 'number') {
                                const c = p.seriesName === 'MA5' ? '#f59e0b' : '#8b5cf6';
                                html += `<div style="font-size:9px;color:${c}">${p.seriesName} ${p.value.toFixed(2)}</div>`;
                            }
                        });
                        return html;
                    }
                },
                axisPointer: { link: [{ xAxisIndex: 'all' }] },
                // 参考指数K线：两个grid左右像素严格一致，不用containLabel（避免隐藏label导致宽度差异）
                grid: [
                    { left: 3, right: 3, top: 4, bottom: '38%' },
                    { left: 3, right: 3, top: '70%', bottom: 2 }
                ],
                xAxis: [
                    // 日期标签放在K线x轴下，只显示mm/dd
                    { type: 'category', gridIndex: 0, data: dates, boundaryGap: true, axisTick: { show: false },
                      axisLabel: { fontSize: 8, color: '#9ca3af', interval: Math.max(1, Math.floor(dates.length / 5)),
                                   hideOverlap: true, formatter: v => v.slice(5).replace('-', '/') } },
                    { type: 'category', gridIndex: 1, data: dates, boundaryGap: true, axisTick: { show: false },
                      axisLabel: { show: false }, axisLine: { show: false } }
                ],
                yAxis: [
                    { scale: true, gridIndex: 0, splitNumber: 3, axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: '#f3f4f6' } } },
                    // 成交量纵轴不显示数据
                    { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } }
                ],

        // 并行获取：指数实时行情（K线切换/标题行情）+ 沪深涨跌分布 + 指标精选
        async function loadMarketIndexData() {
            const [idxRes, statRes, indRes] = await Promise.allSettled([
                fetch('/api/zhangting/market/index', { headers: { 'Content-Type': 'application/json' } }),
                fetch('/api/zhangting/market/updown', { headers: { 'Content-Type': 'application/json' } }),
                fetch('/api/zhangting/market/limit_indicator', { headers: { 'Content-Type': 'application/json' } })
            ]);

            if (idxRes.status === 'fulfilled' && idxRes.value.ok) {
                try { marketIndexData = await idxRes.value.json() || []; } catch (e) { marketIndexData = []; }
            } else {
                console.error('获取大盘指数数据失败:', idxRes.reason || (idxRes.value && idxRes.value.status));
                marketIndexData = [];
            }

            marketUpDownStat = null;
            if (statRes.status === 'fulfilled' && statRes.value.ok) {
                try {
                    const s = await statRes.value.json();
                    if (s && s.total > 0) marketUpDownStat = s;
                } catch (e) { /* 解析失败走兜底 */ }
            } else {
                console.error('获取涨跌分布数据失败:', statRes.reason || (statRes.value && statRes.value.status));
            }

            marketLimitIndicator = [];
            if (indRes.status === 'fulfilled' && indRes.value.ok) {
                try { marketLimitIndicator = await indRes.value.json() || []; } catch (e) { marketLimitIndicator = []; }
            } else {
                console.error('获取指标精选数据失败:', indRes.reason || (indRes.value && indRes.value.status));
            }

            renderMarketPie();
            renderIndexTabs();
        }

        // 按字段名取指标精选数值
        function getIndicatorValue(field) {
            const item = marketLimitIndicator.find(i => i.field === field);
            return item ? item.value : null;
        }

        // 兜底：/market/updown不可用时，用上证+深证家数估算
        function deriveUpDownFromIndexList() {
            const sh = marketIndexData.find(i => i['指数代码'] === '000001');
            const sz = marketIndexData.find(i => i['指数代码'] === '399001');
            const src = (sh && sz) ? [sh, sz] : (marketIndexData.length ? [marketIndexData[0]] : []);
            if (!src.length) return null;
            const sum = field => src.reduce((acc, it) => acc + toNum(it[field]), 0);
            const up = sum('上涨家数'), down = sum('下跌家数'), flat = sum('平盘家数');
            return { up, down, flat, total: up + down + flat };
        }

        // 渲染涨跌分布环形图（红=涨、绿=跌、灰=平）
        // 防遮挡设计：内圈只标占比（重叠自动隐藏），家数放底部图例
        function renderMarketPie() {
            if (!marketPieChart) return;
            const stat = marketUpDownStat || deriveUpDownFromIndexList();
            if (!stat || !stat.total) {
                renderChartError(marketPieChart, '涨跌分布数据加载失败');
                return;
            }

            const pieData = [
                { name: '上涨', value: stat.up, itemStyle: { color: '#EF4444' } },
                { name: '下跌', value: stat.down, itemStyle: { color: '#22C55E' } },
                { name: '平盘', value: stat.flat, itemStyle: { color: '#9CA3AF' } }
            ];

            // 环心文字（HTML悬浮层）：赚钱效应数值（无%）+ 涨停:跌停 数值
            const moneyEffect = getIndicatorValue('MONEYMAKING_EFFECT');
            const moneyEl = document.getElementById('pieMoneyEffect');
            const ratioEl = document.getElementById('pieLimitRatio');
            if (moneyEl) {
                moneyEl.textContent = moneyEffect === null || isNaN(Number(moneyEffect)) ? '--' : Number(moneyEffect).toFixed(1);
            }
            if (ratioEl) {
                const luText = typeof stat.limit_up === 'number' ? stat.limit_up : '--';
                const ldText = typeof stat.limit_down === 'number' ? stat.limit_down : '--';
                // 涨停红 / 跌停绿 区分
                ratioEl.innerHTML = `<span class="text-red-500">${luText}</span><span class="text-gray-400"> : </span><span class="text-green-600">${ldText}</span>`;
            }

            marketPieChart.setOption({
                animation: false,
                tooltip: { trigger: 'item', formatter: '{b}: {c}家 ({d}%)' },
                series: [{
                    type: 'pie',
                    radius: ['44%', '62%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: true,
                    label: { formatter: '{d}%', fontSize: 11, color: '#666' },
                    labelLine: { length: 8, length2: 8 },
                    labelLayout: { hideOverlap: true },
                    data: pieData
                }]
            }, true);  // notMerge=true 清掉错误占位等旧option
        }

        // 渲染指数切换按钮（默认选中第一个）
        function renderIndexTabs() {
            const tabsEl = document.getElementById('indexTabs');
            if (!tabsEl) return;

            setActiveTab(btn);
            updateIndexQuoteInfo(idx);
            loadIndexKline(idx.secid || '');

        function setActiveTab(btn) {
            document.querySelectorAll('#indexTabs button').forEach(b => {
                b.className = b === btn
                    ? 'px-3 py-1.5 text-sm rounded-md bg-primary text-white transition-colors'

        // 标题旁展示当前指数实时点位/涨跌幅/成交额
        function updateIndexQuoteInfo(idx) {
            const el = document.getElementById('indexQuoteInfo');
            if (!el || !idx) return;
            const pctRaw = toNum(idx['涨跌幅(%)']);
            const pctCls = pctRaw > 0 ? 'text-red-600' : (pctRaw < 0 ? 'text-green-600' : 'text-gray-500');
            el.innerHTML =
                `<span class="text-gray-800 font-medium">${idx['最新点位']}</span>` +
                `<span class="${pctCls} ml-2">${pctRaw > 0 ? '+' : ''}${idx['涨跌幅(%)']}%</span>` +
                `<span class="mx-1 text-gray-300">|</span>` +
                `成交额 ${idx['成交额']}`;
        }

        // 加载指数日K线：复用已有 /stock/kline 接口（akshare，东财优先+新浪降级）
        // secid如 1.000001 → gp_no 000001.SH；0.399001 → 399001.SZ
        async function loadIndexKline(secid, retryLeft = 2) {
            if (!secid || !indexKlineChart) return;
            indexKlineChart.showLoading({ text: 'K线加载中...', color: '#1E40AF' });
            try {
                const [mkt, code] = String(secid).split('.');
                const gpNo = `${code}.${mkt === '1' ? 'SH' : 'SZ'}`;
                const resp = await fetch(`/api/zhangting/stock/kline?gp_no=${encodeURIComponent(gpNo)}&days=200`, { headers: { 'Content-Type': 'application/json' } });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const rawData = await resp.json();
                if (Array.isArray(rawData) && rawData.length === 0 && retryLeft > 0) {
                    await new Promise(r => setTimeout(r, 1800));
                    indexKlineChart.hideLoading();
                    return loadIndexKline(secid, retryLeft - 1);
                }
                renderIndexKline(rawData);
            } catch (e) {
                console.error(`指数[${secid}]K线获取失败:`, e);
                renderChartError(indexKlineChart, 'K线加载失败');
            } finally {
                indexKlineChart.hideLoading();
            }
        }

        function renderChartError(chart, msg) {
            if (!chart) return;
            chart.setOption({
                animation: false,
                graphic: {
                    type: 'text', left: 'center', top: 'middle',
                    style: { text: msg, fill: '#EF4444', fontSize: 13 }
                },
                xAxis: { show: false }, yAxis: { show: false }, series: []
            }, true);
        }

        // 成交量友好格式化（tooltip用）
        const fmtVolume = v => v >= 1e8 ? (v / 1e8).toFixed(2) + '亿' : (v >= 1e4 ? (v / 1e4).toFixed(2) + '万' : String(Math.round(v)));

        // 渲染指数K线（/stock/kline返回英文字段 date/open/close/low/high/volume。
        // 样式参考题材接力sectorRender.js：
        // 日期轴在主图与成交量之间 + 主图横向网格线 + 成交量底部横线，双grid固定px边距保证横轴对齐）
        function renderIndexKline(rawList) {
            if (!indexKlineChart) return;
            if (!Array.isArray(rawList) || rawList.length === 0) {
                renderChartError(indexKlineChart, '暂无K线数据');
                return;
            }
            const list = rawList.length > 120 ? rawList.slice(-120) : rawList;

            const dates = list.map(item => {
                const [, m, d] = String(item.date).split('-');
                return `${parseInt(m, 10) || ''}/${parseInt(d, 10) || ''}`;
            });
            const closes = list.map(item => toNum(item.close));
            // [open, close, low, high] 转ECharts candlestick所需结构
            const candlestickData = list.map(item => [toNum(item.open), toNum(item.close), toNum(item.low), toNum(item.high)]);
            const volumes = list.map(item => toNum(item.volume));

            const calculateMA = dayCount => {
                const result = [];
                for (let i = 0; i < closes.length; i++) {
                    if (i < dayCount - 1) { result.push('-'); continue; }
                    let sum = 0;
                    for (let j = 0; j < dayCount; j++) sum += closes[i - j];
                    result.push((sum / dayCount).toFixed(2));
                }
                return result;
            };
            const ma5 = calculateMA(5);
            const ma10 = calculateMA(10);

            indexKlineChart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    textStyle: { fontSize: 11 },
                    formatter: params => {
                        let html = `<div>${params[0].axisValue}</div>`;
                        params.forEach(p => {
                            if (p.seriesType === 'candlestick') {
                                html += `<div>${p.seriesName}：${p.value[1]} / ${p.value[2]} / ${p.value[3]} / ${p.value[4]}</div>`;
                            } else if (p.seriesType === 'line') {
                                html += `<div>${p.seriesName}：${p.value}</div>`;
                            } else if (p.seriesType === 'bar') {
                                html += `<div>${p.seriesName}：${fmtVolume(p.value)}</div>`;
                            }
                        });
                        return html;
                    }
                },
                grid: [
                    { left: 48, right: 14, top: '10%', bottom: '30%' },   // 主图（含下方日期轴）
                    { left: 48, right: 14, top: '74%', bottom: '8%' }    // 成交量图（与主图左右严格对齐）
                ],
                xAxis: [
                    {
                        type: 'category', data: dates, gridIndex: 0,
                        axisLabel: { fontSize: 10, interval: Math.max(1, Math.floor(dates.length / 6)), color: '#888' },
                        axisLine: { lineStyle: { color: '#d9d9d9' } },
                        axisTick: { show: false }
                    },
                    {
                        type: 'category', data: dates, gridIndex: 1,
                        axisLabel: { show: false },
                        axisLine: { show: false },
                        axisTick: { show: false }
                    }
                ],
                yAxis: [
                    {
                        type: 'value', gridIndex: 0, scale: true,
                        splitLine: { lineStyle: { color: '#f5f5f5' } },   // 主图横向网格线
                        axisLine: { show: true, lineStyle: { color: '#d9d9d9' } },
                        axisLabel: { fontSize: 10, color: '#999' }
                    },
                    {
                        type: 'value', gridIndex: 1, scale: true, splitNumber: 2,
                        splitLine: { show: false },
                        axisLine: { show: true, lineStyle: { color: '#d9d9d9' } },   // 成交量底部横线
                        axisLabel: { show: false }
                    }
                ],
                series: [
                    {
                        name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0, barWidth: '60%',
                        data: candlestickData,
                        itemStyle: { color: '#ef4444', color0: '#22c55e', borderColor: '#ef4444', borderColor0: '#22c55e' }
                    },
                    { name: '5日均线', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: ma5, smooth: true, symbol: 'none', lineStyle: { color: '#f59e0b', width: 1.5 } },
                    { name: '10日均线', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: ma10, smooth: true, symbol: 'none', lineStyle: { color: '#3b82f6', width: 1.5 } },
                    {
                        name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, barWidth: '60%',
                        data: volumes.map((v, i) => ({
                            value: v,
                            itemStyle: { color: candlestickData[i] && candlestickData[i][0] < candlestickData[i][1] ? '#ef4444' : '#22c55e' }
                        }))
                    }
                ]
            }, true);  // notMerge=true 清掉错误占位等旧option
        }

        // 页面资源就绪后初始化（Tailwind CDN完成样式计算后canvas尺寸才准确）
        window.addEventListener('load', () => {
            if (document.getElementById('indexKlineChart')) {
                initHomeMarketCharts();
            }
        });
    </script>
</body>
</html>
