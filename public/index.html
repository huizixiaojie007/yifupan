<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易复盘</title>
    <script>
        function checkLogin() {
            const accessToken = localStorage.getItem('access_token');
            const userInfo = localStorage.getItem('user_info');
            if (!accessToken || !userInfo) {
                window.location.href = '/public/login.html';
                return false;
            }
            return true;
        }
        checkLogin();
    </script>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 预加载ECharts库供所有子页面使用 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/extension/dataTool.min.js"></script>
    <script>
        // 标记echarts已加载完成，供子页面使用
        window.echartsReady = true;
    </script>
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#3B82F6',
                        accent: '#60A5FA',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .nav-link {
                @apply flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-300;
            }
            .nav-link:hover {
                @apply bg-blue-50 text-primary;
            }
            .nav-link.active {
                @apply bg-primary text-white;
            }
            .content-container {
                @apply bg-white rounded-xl shadow-sm p-6 transition-all duration-300;
            }
        }
        /* 导航栏收起状态 */
        .sidebar-collapsed {
            width: 40px !important;
        }
        .sidebar-collapsed .nav-text,
        .sidebar-collapsed .brand-text,
        .sidebar-collapsed .footer-text {
            display: none;
        }
        .sidebar-collapsed .nav-link {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }
        .sidebar-collapsed .nav-link i {
            margin-right: 0;
        }
        .main-expanded {
            margin-left: 40px !important;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex">
    <!-- 左侧导航栏 -->

        <!-- 侧面展开收起按钮 -->
        <button id="toggleSidebar" class="absolute right-0 top-1/2 transform -translate-y-1/2 -translate-x-1/2 p-2 bg-white rounded-full shadow-md hover:bg-gray-100 transition-colors z-20" title="收起/展开">
            <i class="fa fa-chevron-left text-gray-600"></i>
        </button>
        <!-- 品牌标识 -->
        <div class="p-3 border-b border-gray-200 flex items-center">
            <h1 class="text-xl font-bold text-primary flex items-center">
                <i class="fa fa-line-chart"></i>
                <span class="brand-text">易复盘</span>
            </h1>
        </div>

        <!-- 导航菜单 -->
        <nav class="flex-1 p-2 space-y-1 overflow-y-auto">
            <a href="#" class="nav-link active" data-target="home" title="首页">
                <i class="fa fa-home w-5 text-center"></i>
                <span class="nav-text">首页</span>
            </a>
            <a href="#" class="nav-link" data-target="limitup" title="连板天梯">

            </a>
            <a href="#" class="nav-link" data-target="theme" title="题材接力">
                <i class="fa fa-random w-5 text-center"></i>
                <span class="nav-text">题材接力</span>
            </a>
            <a href="#" class="nav-link" data-target="board" title="板块分析">
                <i class="fa fa-th-large w-5 text-center"></i>
                <span class="nav-text">板块分析</span>
            </a>

            <a href="#" class="nav-link" data-target="history" title="机会挖掘">
                <i class="fa fa-history w-5 text-center"></i>
                <span class="nav-text">机会挖掘</span>
            </a>
            <a href="#" class="nav-link" data-target="favorites" title="收藏">

        <!-- 底部信息 -->

            <!-- 用户登录按钮 -->

                <button id="userMenuBtn" class="flex items-center gap-3 w-full p-2 rounded-lg hover:bg-gray-100 transition-colors">
                    <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center">
                        <i class="fa fa-user"></i>

                </button>
            </div>
        </div>
    </aside>

    <!-- 用户信息弹框 -->
    <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold">用户信息</h3>
                <button id="closeUserModal" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times"></i>

            </div>
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 rounded-full bg-primary text-white flex items-center justify-center text-2xl">
                    <i class="fa fa-user"></i>
                </div>
                <div>
                    <p id="displayUsername" class="text-lg font-medium">用户名</p>
                    <p id="displayEmail" class="text-sm text-gray-500">user@example.com</p>

            </div>
            <div class="space-y-3">
                <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg transition-colors">

                </a>
                <a href="#" class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg transition-colors">

                    <span>修改信息</span>
                </a>
                <div class="border-t border-gray-100 my-2"></div>
                <a href="#" onclick="handleLogout()" class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-lg transition-colors text-red-600">
                    <i class="fa fa-sign-out text-gray-500 w-5 text-center"></i>
                    <span>退出登录</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 右侧内容区域 -->
    <main id="mainContent" class="flex-1 ml-48 p-6 transition-all duration-300">
        <div class="max-w-7xl mx-auto">
            <!-- 内容容器 -->
            <div class="content-container">
                <!-- 首页内容：上下布局（上=饼图+K线，下=三栏预留） -->
                <div id="home" class="content-section active">
                    <h2 class="text-2xl font-bold mb-6 text-dark">市场概览</h2>

                    <!-- 上半部分：左右布局 -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- 左：市场涨跌分布饼图（沪深两市） -->
                        <div class="h-[320px] flex flex-col bg-white border border-gray-200 rounded-xl p-4">
                            <h3 class="text-lg font-semibold text-dark flex items-baseline gap-2 whitespace-nowrap">
                                涨跌分布
                                <span class="text-xs font-normal text-gray-400">沪深两市</span>
                            </h3>
                            <div class="relative flex-1 w-full min-h-0 mt-1">
                                <div id="marketPieChart" class="w-full h-full"></div>
                                <!-- 环心文字：说明悬浮显示 -->
                                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                                    <div class="relative group pointer-events-auto">
                                        <div id="pieMoneyEffect" class="text-[32px] font-bold text-dark leading-none">--</div>
                                        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block whitespace-nowrap px-2 py-1 rounded-md bg-gray-800 text-white text-xs z-10">赚钱效应（%）</div>
                                    </div>
                                    <div class="relative group pointer-events-auto mt-2.5">
                                        <div id="pieLimitRatio" class="text-sm font-semibold leading-none">--:--</div>
                                        <div class="absolute top-full left-1/2 -translate-x-1/2 mt-1 hidden group-hover:block whitespace-nowrap px-2 py-1 rounded-md bg-gray-800 text-white text-xs z-10">涨停数 : 跌停数</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 右：指数K线图（可切换指数） -->
                        <div class="h-[320px] flex flex-col lg:col-span-2 bg-white border border-gray-200 rounded-xl p-4">
                            <div class="flex items-center justify-between flex-wrap gap-2">
                                <h3 class="text-lg font-semibold text-dark flex items-center gap-2">
                                    指数K线
                                    <span id="indexQuoteInfo" class="text-sm font-normal text-gray-500"></span>
                                </h3>
                                <div id="indexTabs" class="flex gap-2 flex-wrap"></div>
                            </div>
                            <div id="indexKlineChart" class="flex-1 w-full min-h-0 mt-1"></div>
                        </div>
                    </div>

                    <!-- 下半部分：三栏（模块一=融资净买入直方图，模块二=大盘资金流向折线图，模块三预留） -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
                        <!-- 模块一：融资净买入直方图 -->
                        <div class="h-[340px] flex flex-col bg-white border border-gray-200 rounded-xl p-4">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-semibold text-dark flex items-baseline gap-2 whitespace-nowrap">
                                    融资净买入
                                    <span class="text-xs font-normal text-gray-400">沪深两市 · 单位亿元</span>
                                </h3>
                                <div id="marginDays" class="flex gap-1 text-xs">
                                    <button data-d="60" class="px-2 py-1 rounded border border-primary bg-primary text-white">60天</button>
                                    <button data-d="90" class="px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary">90天</button>
                                </div>
                            </div>
                            <div id="marginChart" class="flex-1 w-full min-h-0 mt-1"></div>
                        </div>
                        <!-- 模块二：大盘资金流向折线图 -->
                        <div class="lg:col-span-2 h-[340px] flex flex-col bg-white border border-gray-200 rounded-xl p-4">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-semibold text-dark flex items-baseline gap-2 whitespace-nowrap">
                                    大盘资金流向
                                    <span class="text-xs font-normal text-gray-400">沪深两市 · 单位亿元</span>
                                </h3>
                                <div id="fundflowDays" class="flex gap-1 text-xs">
                                    <button data-mode="today" class="px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary">今日</button>
                                    <button data-d="30" data-mode="day" class="px-2 py-1 rounded border border-primary bg-primary text-white">30天</button>
                                    <button data-d="60" data-mode="day" class="px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary">60天</button>
                                </div>
                            </div>
                            <div id="fundflowChart" class="flex-1 w-full min-h-0 mt-1"></div>
                        </div>
                        <div class="border border-dashed border-gray-300 rounded-xl h-[340px] flex items-center justify-center text-gray-300 text-sm select-none">预留模块三</div>
                    </div>
                </div>

                <!-- 连板天梯内容 -->
                <div id="limitup" class="content-section hidden">
                    <iframe data-src="limitup.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>

                <!-- 题材接力内容 -->
                <div id="theme" class="content-section hidden">
                    <iframe data-src="sector.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>

                <!-- 板块分析内容 -->
                <div id="board" class="content-section hidden">
                    <iframe data-src="board_info.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>

                <!-- 历史数据内容 -->
                <div id="history" class="content-section hidden">
                    <iframe data-src="stock_mining.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>

                <!-- 收藏内容 -->
                <div id="favorites" class="content-section hidden">
                    <iframe data-src="favorites.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>

                <!-- 智能推荐内容 -->
                <div id="recommendation" class="content-section hidden">
                    <iframe data-src="recommendation.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>

                <!-- 管理页面内容 -->
                <div id="admin" class="content-section hidden">
                    <iframe data-src="/public/admin.html" src="about:blank" frameborder="0" class="w-full h-[800px] rounded-lg"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const navLinks = document.querySelectorAll('.nav-link');
            const contentSections = document.querySelectorAll('.content-section');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const toggleBtn = document.getElementById('toggleSidebar');
            const toggleIcon = toggleBtn.querySelector('i');
            const loadedPages = new Set();

            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();

                    const targetId = this.getAttribute('data-target');

                    if (this.classList.contains('active')) {
                        return;
                    }

                    navLinks.forEach(navLink => {
                        navLink.classList.remove('active');
                    });

                    this.classList.add('active');

                    contentSections.forEach(section => {
                        section.classList.add('hidden');
                        section.classList.remove('active');
                    });

                    const targetSection = document.getElementById(targetId);
                    if (targetSection) {
                        targetSection.classList.remove('hidden');
                        targetSection.classList.add('active');

                        if (targetId !== 'home') {
                            const iframe = targetSection.querySelector('iframe');
                            if (iframe) {
                                const dataSrc = iframe.getAttribute('data-src');
                                if (!loadedPages.has(targetId) && dataSrc) {
                                    iframe.src = dataSrc;
                                    loadedPages.add(targetId);
                                }
                            }
                        }

                        let targetUrl = '/public/index.html';
                        switch(targetId) {
                            case 'limitup':
                                targetUrl = '/public/limitup.html';
                                break;
                            case 'theme':
                                targetUrl = '/public/sector.html';
                                break;
                            case 'board':
                                targetUrl = '/public/board_info.html';
                                break;
                            case 'history':
                                targetUrl = '/public/stock_mining.html';
                                break;
                            case 'favorites':
                                targetUrl = '/public/favorites.html';
                                break;
                            case 'recommendation':
                                targetUrl = '/public/recommendation.html';
                                break;
                            case 'admin':
                                targetUrl = '/public/admin.html';
                                break;
                            default:
                                targetUrl = '/public/index.html';
                        }

                        history.pushState({page: targetId}, '', targetUrl);
                    }
                });
            });

            toggleBtn.addEventListener('click', function() {
                sidebar.classList.toggle('sidebar-collapsed');
                mainContent.classList.toggle('main-expanded');

                if (sidebar.classList.contains('sidebar-collapsed')) {
                    toggleIcon.classList.remove('fa-chevron-left');
                    toggleIcon.classList.add('fa-chevron-right');
                    toggleBtn.title = '展开';
                } else {
                    toggleIcon.classList.remove('fa-chevron-right');
                    toggleIcon.classList.add('fa-chevron-left');
                    toggleBtn.title = '收起';
                }

                const limitupIframe = document.querySelector('#limitup iframe');
                if (limitupIframe && limitupIframe.contentWindow) {
                    limitupIframe.contentWindow.postMessage('sidebarStateChanged', '*');
                }

                // 侧边栏收起/展开后重绘首页图表（宽度变化不触发window.resize）
                if (typeof refreshHomeChartsSize === 'function') {
                    setTimeout(refreshHomeChartsSize, 350);
                }
            });

            const userMenuBtn = document.getElementById('userMenuBtn');
            const userModal = document.getElementById('userModal');
            const closeUserModal = document.getElementById('closeUserModal');

            userMenuBtn.addEventListener('click', function() {
                userModal.classList.remove('hidden');
            });

            closeUserModal.addEventListener('click', function() {
                userModal.classList.add('hidden');
            });

            userModal.addEventListener('click', function(e) {
                if (e.target === userModal) {
                    userModal.classList.add('hidden');
                }
            });

            loadUserInfo();

            window.addEventListener('popstate', function(e) {
                if (e.state && e.state.page) {
                    const targetId = e.state.page;

                    navLinks.forEach(navLink => {
                        navLink.classList.remove('active');
                    });

                    const activeLink = document.querySelector(`.nav-link[data-target="${targetId}"]`);
                    if (activeLink) {
                        activeLink.classList.add('active');
                    }

                    contentSections.forEach(section => {
                        section.classList.add('hidden');
                        section.classList.remove('active');
                    });

                    const targetSection = document.getElementById(targetId);
                    if (targetSection) {
                        targetSection.classList.remove('hidden');
                        targetSection.classList.add('active');

                        if (targetId !== 'home') {
                            const iframe = targetSection.querySelector('iframe');
                            if (iframe) {
                                const dataSrc = iframe.getAttribute('data-src');
                                if (!loadedPages.has(targetId) && dataSrc) {
                                    iframe.src = dataSrc;
                                    loadedPages.add(targetId);
                                }
                            }
                        }
                    }
                }
            });
        });

        function handleLogout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            localStorage.removeItem('loginUser');
            document.cookie = 'access_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC';

            window.location.href = '/public/login.html';
        }

        function loadUserInfo() {
            const userInfoStr = localStorage.getItem('user_info');
            console.log('user_info 内容:', userInfoStr);
            if (userInfoStr) {
                try {
                    const userInfo = JSON.parse(userInfoStr);
                    console.log('解析后的 userInfo:', userInfo);
                    console.log('userInfo.vip_date:', userInfo.vip_date);
                    const displayUsername = document.getElementById('displayUsername');
                    const displayEmail = document.getElementById('displayEmail');
                    if (displayUsername) {
                        displayUsername.textContent = userInfo.username || '用户名';
                    }
                    if (displayEmail) {
                        displayEmail.textContent = userInfo.email || 'user@example.com';
                    }
                    const displayVipDate = document.getElementById('displayVipDate');
                    if (displayVipDate) {
                        if (userInfo.vip_date) {
                            const date = new Date(userInfo.vip_date);
                            const formattedDate = date.toLocaleDateString('zh-CN');
                            displayVipDate.textContent = formattedDate;
                        } else {
                            displayVipDate.textContent = '--';
                        }
                    }
                    const navUsername = document.getElementById('navUsername');
                    if (navUsername) {
                        navUsername.textContent = userInfo.username || '用户登录';
                    }

                    const adminNavLink = document.getElementById('adminNavLink');
                    if (adminNavLink) {
                        if (userInfo.is_superuser) {
                            adminNavLink.style.display = 'flex';
                        } else {
                            adminNavLink.style.display = 'none';
                        }
                    }
                } catch (e) {
                    console.error('解析用户信息失败:', e);
                }
            }
        }
    </script>

    <!-- 首页市场图表：涨跌分布饼图 + 指数K线 -->
    <script>
        let marketIndexData = [];      // get_market_index_list 返回的指数实时数据
        let marketUpDownStat = null;   // 沪深两市涨跌分布统计（/market/updown）
        let marketLimitIndicator = []; // 指标精选数据（/market/limit_indicator）
        let marketPieChart = null;     // 涨跌分布饼图实例
        let indexKlineChart = null;    // 指数K线图实例
        let fundflowChart = null;      // 大盘资金流向折线图实例
        let fundflowDays = 30;         // 资金流向默认显示天数（日线模式）
        let fundflowMode = 'day';      // 'day' 日线 / 'today' 今日分时
        let marginChart = null;        // 融资净买入直方图实例
        let marginDays = 60;           // 融资净买入默认显示天数（60天）

        const toNum = v => {
            const n = parseFloat(v);
            return isNaN(n) ? 0 : n;
        };

        // 初始化首页图表
        async function initHomeMarketCharts() {
            if (!window.echarts) {
                console.error('echarts未加载，无法渲染首页图表');
                return;
            }
            const pieDom = document.getElementById('marketPieChart');
            const klineDom = document.getElementById('indexKlineChart');
            const ffDom = document.getElementById('fundflowChart');
            const mgDom = document.getElementById('marginChart');
            if (pieDom) marketPieChart = echarts.init(pieDom);
            if (klineDom) indexKlineChart = echarts.init(klineDom);
            if (ffDom) fundflowChart = echarts.init(ffDom);
            if (mgDom) marginChart = echarts.init(mgDom);

            bindFundflowDayTabs();
            bindMarginDayTabs();
            await loadMarketIndexData();
            await Promise.all([
                loadFundflowData(fundflowDays),
                loadMarginData(marginDays)
            ]);

            window.addEventListener('resize', refreshHomeChartsSize);
        }

        function refreshHomeChartsSize() {
            if (marketPieChart) marketPieChart.resize();
            if (indexKlineChart) indexKlineChart.resize();
            if (fundflowChart) fundflowChart.resize();
            if (marginChart) marginChart.resize();
        }

        // 资金流向 今日/15/30/60天 切换按钮
        function bindFundflowDayTabs() {
            const bar = document.getElementById('fundflowDays');
            if (!bar) return;
            bar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('button').forEach(b => {
                        b.className = 'px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary';
                    });
                    btn.className = 'px-2 py-1 rounded border border-primary bg-primary text-white';
                    const mode = btn.getAttribute('data-mode') || 'day';
                    fundflowMode = mode;
                    if (mode === 'today') {
                        loadFundflowToday();
                    } else {
                        fundflowDays = Number(btn.getAttribute('data-d')) || 30;
                        loadFundflowData(fundflowDays);
                    }
                });
            });
        }

        async function loadFundflowData(days) {
            if (!fundflowChart) return;
            try {
                const res = await fetch(`/api/zhangting/market/fundflow?days=${days}`, { headers: { 'Content-Type': 'application/json' } });
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json() || [];
                renderFundflowChart(data, 'day');
            } catch (e) {
                console.error('加载资金流向失败:', e);
                renderChartError(fundflowChart, '资金流向数据加载失败');
            }
        }

        async function loadFundflowToday() {
            if (!fundflowChart) return;
            try {
                const res = await fetch('/api/zhangting/market/fundflow/today', { headers: { 'Content-Type': 'application/json' } });
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json() || [];
                renderFundflowChart(data, 'today');
            } catch (e) {
                console.error('加载今日分时资金流向失败:', e);
                renderChartError(fundflowChart, '今日分时资金流向加载失败');
            }
        }

        // 融资买入 30/60 天切换按钮
        function bindMarginDayTabs() {
            const bar = document.getElementById('marginDays');
            if (!bar) return;
            bar.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('button').forEach(b => {
                        b.className = 'px-2 py-1 rounded border border-gray-300 text-gray-500 hover:text-primary hover:border-primary';
                    });
                    btn.className = 'px-2 py-1 rounded border border-primary bg-primary text-white';
                    marginDays = Number(btn.getAttribute('data-d')) || 30;
                    loadMarginData(marginDays);
                });
            });
        }

        async function loadMarginData(days) {
            if (!marginChart) return;
            try {
                const res = await fetch(`/api/zhangting/market/margin?days=${days}`, { headers: { 'Content-Type': 'application/json' } });
                if (!res.ok) throw new Error(res.statusText);
                const data = await res.json() || [];
                renderMarginChart(data);
            } catch (e) {
                console.error('加载两融数据失败:', e);
                renderChartError(marginChart, '两融数据加载失败');
            }
        }

        // 融资净买入直方图（正红柱=净买入，负绿柱=净卖出）
        function renderMarginChart(data) {
            if (!marginChart || !data.length) {
                if (marginChart) renderChartError(marginChart, '暂无两融数据');
                return;
            }
            const xLabel = data.map(d => d['日期']);
            const netData = data.map(d => toNum(d['融资净买入(亿)']));

            marginChart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    valueFormatter: v => (v == null ? v : (v.toFixed ? v.toFixed(2) : v) + ' 亿')
                },
                grid: { left: 48, right: 14, top: 16, bottom: 28 },
                xAxis: {
                    type: 'category', data: xLabel,
                    axisTick: { show: false },
                    axisLabel: { fontSize: 10, color: '#9CA3AF', interval: 'auto' },
                    axisLine: { lineStyle: { color: '#E5E7EB' } }
                },
                yAxis: {
                    type: 'value', name: '融资净买入',
                    nameTextStyle: { color: '#9CA3AF', fontSize: 10 },
                    axisLabel: { fontSize: 10, color: '#9CA3AF' },
                    splitLine: { lineStyle: { color: '#F3F4F6' } },
                    axisLine: { show: false }
                },
                series: [
                    {
                        name: '融资净买入额',
                        type: 'bar',
                        barWidth: '60%',
                        data: netData,
                        itemStyle: {
                            color: params => (params.value >= 0 ? '#EF4444' : '#22C55E'),
                            borderRadius: params => (params.value >= 0 ? [3, 3, 0, 0] : [0, 0, 3, 3])
                        }
                    }
                ]
            }, true);
        }

        function renderFundflowChart(data, mode = 'day') {
            if (!fundflowChart || !data.length) {
                if (fundflowChart) renderChartError(fundflowChart, '暂无资金流向数据');
                return;
            }
            const xKey = mode === 'today' ? '时间' : '日期';
            const xLabel = data.map(d => d[xKey]);
            const fields = [
                { name: '主力净流入', color: '#7C3AED' },   // 紫（与超大单互换）
                { name: '超大单净流入', color: '#DC2626' }, // 红（与主力净流入互换）
                { name: '大单净流入', color: '#EAB308' },   // 黄
                { name: '中单净流入', color: '#0284C7' },   // 蓝
                { name: '小单净流入', color: '#059669' }    // 绿
            ];
            // 分时X轴刻度过密（一天240分钟），按整点/半点间隔抽样显示
            const xTickInterval = mode === 'today' ? (v => xLabel[v].slice(-3) === ':00') : 'auto';
            const xLabelFormatter = mode === 'today'
                ? undefined
                : undefined;
            fundflowChart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross', label: { backgroundColor: '#374151' } },
                    valueFormatter: v => (v == null ? v : (v.toFixed ? v.toFixed(2) : v) + ' 亿')
                },
                legend: {
                    top: 0, right: 4, itemGap: 14, textStyle: { fontSize: 11, color: '#666' }
                },
                grid: { left: 48, right: 14, top: 30, bottom: 28 },
                xAxis: {
                    type: 'category', data: xLabel,
                    boundaryGap: false,
                    axisLabel: {
                        fontSize: 10, color: '#9CA3AF',
                        ...(mode === 'today' ? { interval: xTickInterval, rotate: 0 } : {})
                    },
                    axisLine: { lineStyle: { color: '#E5E7EB' } }
                },
                yAxis: {
                    type: 'value', name: '亿元',
                    nameTextStyle: { color: '#9CA3AF', fontSize: 10 },
                    axisLabel: { fontSize: 10, color: '#9CA3AF' },
                    splitLine: { lineStyle: { color: '#F3F4F6' } },
                    axisLine: { show: false }
                },
                series: [
                    // 背景色带：0轴上粉色、0轴下浅绿色（放在第一个系列里，以y轴边界定位即覆盖全X范围）
                    {
                        type: 'line',
                        showSymbol: false, silent: true,
                        lineStyle: { opacity: 0 },
                        data: [],
                        markArea: {
                            silent: true, z: 0,
                            data: [
                                [
                                    // 0 轴以上 → 淡绿色（低饱和：green-100）
                                    { yAxis: 0, itemStyle: { color: '#DCFCE7' } },
                                    { yAxis: 'max' }
                                ],
                                [
                                    // 0 轴以下 → 淡粉色（低饱和：pink-100）
                                    { yAxis: 'min', itemStyle: { color: '#FCE7F3' } },
                                    { yAxis: 0 }
                                ]
                            ]
                        }
                    },
                    ...fields.map(f => ({
                        name: f.name, type: 'line', smooth: true, showSymbol: false,
                        lineStyle: { color: f.color, width: 1.8 },
                        itemStyle: { color: f.color },
                        data: data.map(d => d[f.name])
                    }))
                ]
            }, true);
        }

        // 并行获取：指数实时行情（K线切换/标题行情）+ 沪深涨跌分布 + 指标精选
        async function loadMarketIndexData() {
            const [idxRes, statRes, indRes] = await Promise.allSettled([
                fetch('/api/zhangting/market/index', { headers: { 'Content-Type': 'application/json' } }),
                fetch('/api/zhangting/market/updown', { headers: { 'Content-Type': 'application/json' } }),
                fetch('/api/zhangting/market/limit_indicator', { headers: { 'Content-Type': 'application/json' } })
            ]);

            if (idxRes.status === 'fulfilled' && idxRes.value.ok) {
                try { marketIndexData = await idxRes.value.json() || []; } catch (e) { marketIndexData = []; }
            } else {
                console.error('获取大盘指数数据失败:', idxRes.reason || (idxRes.value && idxRes.value.status));
                marketIndexData = [];
            }

            marketUpDownStat = null;
            if (statRes.status === 'fulfilled' && statRes.value.ok) {
                try {
                    const s = await statRes.value.json();
                    if (s && s.total > 0) marketUpDownStat = s;
                } catch (e) { /* 解析失败走兜底 */ }
            } else {
                console.error('获取涨跌分布数据失败:', statRes.reason || (statRes.value && statRes.value.status));
            }

            marketLimitIndicator = [];
            if (indRes.status === 'fulfilled' && indRes.value.ok) {
                try { marketLimitIndicator = await indRes.value.json() || []; } catch (e) { marketLimitIndicator = []; }
            } else {
                console.error('获取指标精选数据失败:', indRes.reason || (indRes.value && indRes.value.status));
            }

            renderMarketPie();
            renderIndexTabs();
        }

        // 按字段名取指标精选数值
        function getIndicatorValue(field) {
            const item = marketLimitIndicator.find(i => i.field === field);
            return item ? item.value : null;
        }

        // 兜底：/market/updown不可用时，用上证+深证家数估算
        function deriveUpDownFromIndexList() {
            const sh = marketIndexData.find(i => i['指数代码'] === '000001');
            const sz = marketIndexData.find(i => i['指数代码'] === '399001');
            const src = (sh && sz) ? [sh, sz] : (marketIndexData.length ? [marketIndexData[0]] : []);
            if (!src.length) return null;
            const sum = field => src.reduce((acc, it) => acc + toNum(it[field]), 0);
            const up = sum('上涨家数'), down = sum('下跌家数'), flat = sum('平盘家数');
            return { up, down, flat, total: up + down + flat };
        }

        // 渲染涨跌分布环形图（红=涨、绿=跌、灰=平）
        // 防遮挡设计：内圈只标占比（重叠自动隐藏），家数放底部图例
        function renderMarketPie() {
            if (!marketPieChart) return;
            const stat = marketUpDownStat || deriveUpDownFromIndexList();
            if (!stat || !stat.total) {
                renderChartError(marketPieChart, '涨跌分布数据加载失败');
                return;
            }

            const pieData = [
                { name: '上涨', value: stat.up, itemStyle: { color: '#EF4444' } },
                { name: '下跌', value: stat.down, itemStyle: { color: '#22C55E' } },
                { name: '平盘', value: stat.flat, itemStyle: { color: '#9CA3AF' } }
            ];

            // 环心文字（HTML悬浮层）：赚钱效应数值（无%）+ 涨停:跌停 数值
            const moneyEffect = getIndicatorValue('MONEYMAKING_EFFECT');
            const moneyEl = document.getElementById('pieMoneyEffect');
            const ratioEl = document.getElementById('pieLimitRatio');
            if (moneyEl) {
                moneyEl.textContent = moneyEffect === null || isNaN(Number(moneyEffect)) ? '--' : Number(moneyEffect).toFixed(1);
            }
            if (ratioEl) {
                const luText = typeof stat.limit_up === 'number' ? stat.limit_up : '--';
                const ldText = typeof stat.limit_down === 'number' ? stat.limit_down : '--';
                // 涨停红 / 跌停绿 区分
                ratioEl.innerHTML = `<span class="text-red-500">${luText}</span><span class="text-gray-400"> : </span><span class="text-green-600">${ldText}</span>`;
            }

            marketPieChart.setOption({
                animation: false,
                tooltip: { trigger: 'item', formatter: '{b}: {c}家 ({d}%)' },
                series: [{
                    type: 'pie',
                    radius: ['44%', '62%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: true,
                    label: { formatter: '{d}%', fontSize: 11, color: '#666' },
                    labelLine: { length: 8, length2: 8 },
                    labelLayout: { hideOverlap: true },
                    data: pieData
                }]
            }, true);  // notMerge=true 清掉错误占位等旧option
        }

        // 渲染指数切换按钮（默认选中第一个）
        function renderIndexTabs() {
            const tabsEl = document.getElementById('indexTabs');
            if (!tabsEl) return;
            tabsEl.innerHTML = '';
            marketIndexData.forEach(idx => {
                const btn = document.createElement('button');
                btn.textContent = idx['指数名称'];
                btn.addEventListener('click', () => selectIndex(idx, btn));
                tabsEl.appendChild(btn);
            });

            if (marketIndexData.length > 0) {
                selectIndex(marketIndexData[0], tabsEl.firstChild);
            }
        }

        function selectIndex(idx, btn) {
            setActiveTab(btn);
            updateIndexQuoteInfo(idx);
            loadIndexKline(idx.secid || '');
        }

        function setActiveTab(btn) {
            document.querySelectorAll('#indexTabs button').forEach(b => {
                b.className = b === btn
                    ? 'px-3 py-1.5 text-sm rounded-md bg-primary text-white transition-colors'
                    : 'px-3 py-1.5 text-sm rounded-md border border-gray-300 text-gray-600 hover:border-primary hover:text-primary transition-colors';
            });
        }

        // 标题旁展示当前指数实时点位/涨跌幅/成交额
        function updateIndexQuoteInfo(idx) {
            const el = document.getElementById('indexQuoteInfo');
            if (!el || !idx) return;
            const pctRaw = toNum(idx['涨跌幅(%)']);
            const pctCls = pctRaw > 0 ? 'text-red-600' : (pctRaw < 0 ? 'text-green-600' : 'text-gray-500');
            el.innerHTML =
                `<span class="text-gray-800 font-medium">${idx['最新点位']}</span>` +
                `<span class="${pctCls} ml-2">${pctRaw > 0 ? '+' : ''}${idx['涨跌幅(%)']}%</span>` +
                `<span class="mx-1 text-gray-300">|</span>` +
                `成交额 ${idx['成交额']}`;
        }

        // 加载指数日K线：复用已有 /stock/kline 接口（akshare，东财优先+新浪降级）
        // secid如 1.000001 → gp_no 000001.SH；0.399001 → 399001.SZ
        async function loadIndexKline(secid, retryLeft = 2) {
            if (!secid || !indexKlineChart) return;
            indexKlineChart.showLoading({ text: 'K线加载中...', color: '#1E40AF' });
            try {
                const [mkt, code] = String(secid).split('.');
                const gpNo = `${code}.${mkt === '1' ? 'SH' : 'SZ'}`;
                const resp = await fetch(`/api/zhangting/stock/kline?gp_no=${encodeURIComponent(gpNo)}&days=200`, { headers: { 'Content-Type': 'application/json' } });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const rawData = await resp.json();
                if (Array.isArray(rawData) && rawData.length === 0 && retryLeft > 0) {
                    await new Promise(r => setTimeout(r, 1800));
                    indexKlineChart.hideLoading();
                    return loadIndexKline(secid, retryLeft - 1);
                }
                renderIndexKline(rawData);
            } catch (e) {
                console.error(`指数[${secid}]K线获取失败:`, e);
                renderChartError(indexKlineChart, 'K线加载失败');
            } finally {
                indexKlineChart.hideLoading();
            }
        }

        function renderChartError(chart, msg) {
            if (!chart) return;
            chart.setOption({
                animation: false,
                graphic: {
                    type: 'text', left: 'center', top: 'middle',
                    style: { text: msg, fill: '#EF4444', fontSize: 13 }
                },
                xAxis: { show: false }, yAxis: { show: false }, series: []
            }, true);
        }

        // 成交量友好格式化（tooltip用）
        const fmtVolume = v => v >= 1e8 ? (v / 1e8).toFixed(2) + '亿' : (v >= 1e4 ? (v / 1e4).toFixed(2) + '万' : String(Math.round(v)));

        // 渲染指数K线（/stock/kline返回英文字段 date/open/close/low/high/volume。
        // 样式参考题材接力sectorRender.js：
        // 日期轴在主图与成交量之间 + 主图横向网格线 + 成交量底部横线，双grid固定px边距保证横轴对齐）
        function renderIndexKline(rawList) {
            if (!indexKlineChart) return;
            if (!Array.isArray(rawList) || rawList.length === 0) {
                renderChartError(indexKlineChart, '暂无K线数据');
                return;
            }
            const list = rawList.length > 120 ? rawList.slice(-120) : rawList;

            const dates = list.map(item => {
                const [, m, d] = String(item.date).split('-');
                return `${parseInt(m, 10) || ''}/${parseInt(d, 10) || ''}`;
            });
            const closes = list.map(item => toNum(item.close));
            // [open, close, low, high] 转ECharts candlestick所需结构
            const candlestickData = list.map(item => [toNum(item.open), toNum(item.close), toNum(item.low), toNum(item.high)]);
            const volumes = list.map(item => toNum(item.volume));

            const calculateMA = dayCount => {
                const result = [];
                for (let i = 0; i < closes.length; i++) {
                    if (i < dayCount - 1) { result.push('-'); continue; }
                    let sum = 0;
                    for (let j = 0; j < dayCount; j++) sum += closes[i - j];
                    result.push((sum / dayCount).toFixed(2));
                }
                return result;
            };
            const ma5 = calculateMA(5);
            const ma10 = calculateMA(10);

            indexKlineChart.setOption({
                animation: false,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' },
                    textStyle: { fontSize: 11 },
                    formatter: params => {
                        let html = `<div>${params[0].axisValue}</div>`;
                        params.forEach(p => {
                            if (p.seriesType === 'candlestick') {
                                html += `<div>${p.seriesName}：${p.value[1]} / ${p.value[2]} / ${p.value[3]} / ${p.value[4]}</div>`;
                            } else if (p.seriesType === 'line') {
                                html += `<div>${p.seriesName}：${p.value}</div>`;
                            } else if (p.seriesType === 'bar') {
                                html += `<div>${p.seriesName}：${fmtVolume(p.value)}</div>`;
                            }
                        });
                        return html;
                    }
                },
                grid: [
                    { left: 48, right: 14, top: '10%', bottom: '30%' },   // 主图（含下方日期轴）
                    { left: 48, right: 14, top: '74%', bottom: '8%' }    // 成交量图（与主图左右严格对齐）
                ],
                xAxis: [
                    {
                        type: 'category', data: dates, gridIndex: 0,
                        axisLabel: { fontSize: 10, interval: Math.max(1, Math.floor(dates.length / 6)), color: '#888' },
                        axisLine: { lineStyle: { color: '#d9d9d9' } },
                        axisTick: { show: false }
                    },
                    {
                        type: 'category', data: dates, gridIndex: 1,
                        axisLabel: { show: false },
                        axisLine: { show: false },
                        axisTick: { show: false }
                    }
                ],
                yAxis: [
                    {
                        type: 'value', gridIndex: 0, scale: true,
                        splitLine: { lineStyle: { color: '#f5f5f5' } },   // 主图横向网格线
                        axisLine: { show: true, lineStyle: { color: '#d9d9d9' } },
                        axisLabel: { fontSize: 10, color: '#999' }
                    },
                    {
                        type: 'value', gridIndex: 1, scale: true, splitNumber: 2,
                        splitLine: { show: false },
                        axisLine: { show: true, lineStyle: { color: '#d9d9d9' } },   // 成交量底部横线
                        axisLabel: { show: false }
                    }
                ],
                series: [
                    {
                        name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0, barWidth: '60%',
                        data: candlestickData,
                        itemStyle: { color: '#ef4444', color0: '#22c55e', borderColor: '#ef4444', borderColor0: '#22c55e' }
                    },
                    { name: '5日均线', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: ma5, smooth: true, symbol: 'none', lineStyle: { color: '#f59e0b', width: 1.5 } },
                    { name: '10日均线', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: ma10, smooth: true, symbol: 'none', lineStyle: { color: '#3b82f6', width: 1.5 } },
                    {
                        name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, barWidth: '60%',
                        data: volumes.map((v, i) => ({
                            value: v,
                            itemStyle: { color: candlestickData[i] && candlestickData[i][0] < candlestickData[i][1] ? '#ef4444' : '#22c55e' }
                        }))
                    }
                ]
            }, true);  // notMerge=true 清掉错误占位等旧option
        }

        // 页面资源就绪后初始化（Tailwind CDN完成样式计算后canvas尺寸才准确）
        window.addEventListener('load', () => {
            if (document.getElementById('indexKlineChart')) {
                initHomeMarketCharts();
            }
        });
    </script>
</body>
</html>
